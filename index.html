/* =========================
   OPEN EMPLOYEE
========================= */

function openEmployee(id) {

    const employee = employees[id];

    if (!employee) {
        alert("Сотрудник не найден");
        return;
    }

    document.getElementById("profileName").textContent =
        employee.name;

    document.getElementById("profileRole").textContent =
        employee.role;

    document.getElementById("profileDepartment").textContent =
        employee.department;

    document.getElementById("profileSalary").textContent =
        employee.salary;

    document.getElementById("profileKpi").textContent =
        employee.kpi;

    document.getElementById("profileWorkload").textContent =
        employee.workload;

    document.getElementById("profileExperience").textContent =
        employee.experience;

    document.getElementById("profileAvatar").textContent =
        employee.avatar;


    const goals =
        document.getElementById("profileGoals");

    goals.innerHTML = "";


    employee.goals.forEach(function(goal) {

        const element =
            document.createElement("div");

        element.className = "goal";

        element.textContent = "• " + goal;

        goals.appendChild(element);

    });


    document
        .getElementById("employeeModal")
        .classList.add("active");
}


/* =========================
   CLOSE EMPLOYEE
========================= */

function closeEmployee() {

    document
        .getElementById("employeeModal")
        .classList.remove("active");
}


/* =========================
   UPDATE EMPLOYEE CARD
========================= */

function updateEmployeeCard(employeeId) {

    const cards =
        document.querySelectorAll(".employee");


    cards.forEach(function(card) {

        const onclickValue =
            card.getAttribute("onclick");


        if (
            onclickValue ===
            "openEmployee('" + employeeId + "')"
        ) {

            const employee =
                employees[employeeId];


            const percentage =
                parseInt(employee.kpi);


            const numbers =
                card.querySelectorAll(
                    ".kpi-label span"
                );


            if (numbers.length >= 2) {

                numbers[1].textContent =
                    employee.kpi;
            }


            const progress =
                card.querySelector(".progress-bar");


            if (progress) {

                progress.style.width =
                    percentage + "%";
            }
        }

    });
}


/* =========================
   CEO ACTIONS
========================= */

function employeeAction(action) {

    /* CHANGE KPI */

    if (action === "Изменить KPI") {

        const currentEmployee =
            document.getElementById(
                "profileName"
            ).textContent;


        let employeeId = null;


        for (const id in employees) {

            if (
                employees[id].name ===
                currentEmployee
            ) {

                employeeId = id;
                break;
            }
        }


        if (!employeeId) {

            alert("Сотрудник не найден");
            return;
        }


        const employee =
            employees[employeeId];


        const newKpi = prompt(

            "Изменить KPI сотрудника " +
            employee.name +

            "\n\nТекущий KPI: " +
            employee.kpi +

            "\n\nВведите новый KPI от 0 до 100:",

            parseInt(employee.kpi)
        );


        if (newKpi === null) {
            return;
        }


        const value =
            Number(newKpi);


        if (
            isNaN(value) ||
            value < 0 ||
            value > 100
        ) {

            alert(
                "Введите число от 0 до 100."
            );

            return;
        }


        employee.kpi =
            value + "%";


        document
            .getElementById("profileKpi")
            .textContent =
            employee.kpi;


        updateEmployeeCard(
            employeeId
        );


        return;
    }


    /* OTHER ACTIONS */

    alert(
        "CEO: " +
        action +
        "\n\nЭта функция пока не подключена."
    );
}


/* =========================
   NAVIGATION
========================= */

function showSection(
    sectionId,
    button
) {

    document
        .querySelectorAll(".section")
        .forEach(function(section) {

            section.style.display =
                "none";

        });


    const selectedSection =
        document.getElementById(
            sectionId
        );


    if (selectedSection) {

        selectedSection.style.display =
            "block";
    }


    document
        .querySelectorAll(".menu button")
        .forEach(function(btn) {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add("active");


    const titles = {

        dashboard: "CEO Dashboard",

        company: "Компания",

        employees: "Сотрудники",

        departments: "Отделы",

        crm: "CRM",

        projects: "Проекты",

        tasks: "Задачи",

        finance: "Финансы",

        hr: "HR",

        decisions: "Центр решений"

    };


    document
        .getElementById("pageTitle")
        .textContent =
        titles[sectionId];
}


/* =========================
   CLOSE MODAL
========================= */

document
    .getElementById("employeeModal")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeEmployee();
            }

        }
    );


/* =========================
   ESC
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeEmployee();
        }

    }
);
