<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alatau Nexus — Company OS</title>

<style>
:root{
    --bg:#07101d;
    --panel:#0d1828;
    --panel2:#111f32;
    --panel3:#16263b;
    --border:#22344b;
    --text:#edf4ff;
    --muted:#8fa3bd;
    --blue:#4f9cff;
    --green:#35d399;
    --yellow:#f6c85f;
    --red:#ff6874;
    --purple:#9b7cff;
    --cyan:#42d9ff;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Segoe UI,Arial,sans-serif;
    overflow:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:235px;
    background:#08121f;
    border-right:1px solid var(--border);
    padding:18px 12px;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
}

.logo{
    font-size:19px;
    font-weight:800;
    padding:8px 12px 4px;
    letter-spacing:.5px;
}

.logo span{
    color:var(--blue);
}

.logo-sub{
    color:var(--muted);
    font-size:11px;
    padding:0 12px 20px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.nav button{
    border:0;
    background:transparent;
    color:#9fb0c6;
    text-align:left;
    padding:11px 13px;
    border-radius:9px;
    transition:.15s;
}

.nav button:hover{
    background:#122136;
    color:white;
}

.nav button.active{
    background:#173152;
    color:white;
}

.sidebar-bottom{
    margin-top:auto;
    padding:10px;
    border-top:1px solid var(--border);
}

.ceo-mini{
    display:flex;
    gap:10px;
    align-items:center;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#1c3554;
    font-weight:800;
    color:white;
}

.ceo-mini-name{
    font-size:13px;
    font-weight:700;
}

.ceo-mini-role{
    color:var(--muted);
    font-size:11px;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:64px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#091522;
}

.page-title{
    font-size:18px;
    font-weight:700;
}

.top-right{
    display:flex;
    gap:10px;
    align-items:center;
}

.day-pill{
    border:1px solid var(--border);
    background:#101d2e;
    padding:8px 12px;
    border-radius:8px;
    color:#cbd9eb;
    font-size:12px;
}

.run-btn{
    border:0;
    border-radius:8px;
    padding:8px 14px;
    background:var(--green);
    color:#06140f;
    font-weight:800;
}

.run-btn.paused{
    background:var(--yellow);
}

.content{
    flex:1;
    overflow:auto;
    padding:22px;
}

/* COMMON */

.grid{
    display:grid;
    gap:14px;
}

.stats{
    grid-template-columns:repeat(6,1fr);
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
}

.stat-title{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.stat-value{
    margin-top:7px;
    font-size:23px;
    font-weight:800;
}

.stat-sub{
    color:var(--muted);
    margin-top:4px;
    font-size:11px;
}

.section-title{
    margin:24px 0 10px;
    font-size:14px;
    font-weight:800;
}

.two{
    grid-template-columns:1.35fr .85fr;
}

.three{
    grid-template-columns:repeat(3,1fr);
}

.list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.list-row{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px 12px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.muted{
    color:var(--muted);
}

.small{
    font-size:11px;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:4px 8px;
    border-radius:20px;
    background:#17283d;
    color:#c9d8eb;
    font-size:10px;
    font-weight:700;
}

.badge.green{
    background:#12352c;
    color:#5be4ae;
}

.badge.red{
    background:#3c1820;
    color:#ff8b94;
}

.badge.yellow{
    background:#3b3017;
    color:#f8d77e;
}

.badge.blue{
    background:#142d4c;
    color:#72b3ff;
}

.btn{
    border:1px solid var(--border);
    background:#142238;
    color:white;
    padding:8px 11px;
    border-radius:7px;
}

.btn:hover{
    background:#1b304c;
}

.btn.primary{
    background:var(--blue);
    color:#06101d;
    border-color:var(--blue);
    font-weight:700;
}

.btn.danger{
    background:#481d27;
    border-color:#672a37;
    color:#ff9ba3;
}

.btn.success{
    background:#12392e;
    border-color:#1e5b49;
    color:#61e3b2;
}

.progress{
    height:6px;
    background:#1a293c;
    border-radius:10px;
    overflow:hidden;
}

.progress > div{
    height:100%;
    background:var(--blue);
}

/* DASHBOARD */

.briefing{
    background:linear-gradient(135deg,#11253d,#0d1828);
    border:1px solid #284767;
}

.briefing h2{
    margin:0 0 7px;
    font-size:16px;
}

.briefing p{
    margin:4px 0;
    color:#b6c6da;
    font-size:13px;
}

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:15px;
}

.kpi-box{
    background:#0b1726;
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px;
}

.kpi-box strong{
    display:block;
    margin-top:5px;
    font-size:17px;
}

/* FEED */

.feed{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:390px;
    overflow:auto;
}

.feed-item{
    display:flex;
    gap:10px;
    padding:10px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
}

.feed-icon{
    width:28px;
    height:28px;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#182a41;
    flex-shrink:0;
}

.feed-main{
    flex:1;
}

.feed-title{
    font-size:12px;
    font-weight:700;
}

.feed-text{
    margin-top:3px;
    color:#9fb0c4;
    font-size:11px;
}

.feed-time{
    color:#667c98;
    font-size:10px;
}

/* EMPLOYEES */

.employee-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.employee-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:11px;
    padding:14px;
}

.employee-head{
    display:flex;
    gap:10px;
    align-items:center;
}

.employee-name{
    font-size:13px;
    font-weight:800;
}

.employee-role{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.employee-meta{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.meta-box{
    background:#101d2d;
    padding:7px;
    border-radius:7px;
}

.meta-box span{
    display:block;
    color:var(--muted);
    font-size:9px;
}

.meta-box strong{
    font-size:12px;
}

.employee-actions{
    margin-top:12px;
    display:flex;
    gap:6px;
}

/* CRM */

.crm-board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    overflow-x:auto;
}

.crm-column{
    min-width:220px;
    background:#0b1725;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
}

.crm-column-title{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    font-weight:800;
    margin-bottom:9px;
}

.deal{
    background:#121f31;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
    cursor:pointer;
}

.deal:hover{
    border-color:#3b5d83;
}

.deal-name{
    font-weight:700;
    font-size:12px;
}

.deal-client{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.deal-value{
    font-size:13px;
    font-weight:800;
    margin-top:9px;
}

.deal-owner{
    color:#8fbfff;
    font-size:10px;
    margin-top:4px;
}

/* MESSENGER */

.messenger{
    height:calc(100vh - 108px);
    display:grid;
    grid-template-columns:250px 1fr 280px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel);
}

.chat-list{
    border-right:1px solid var(--border);
    background:#0a1523;
    overflow:auto;
}

.chat-list-header{
    padding:14px;
    border-bottom:1px solid var(--border);
    font-weight:800;
}

.chat-item{
    padding:11px 13px;
    border-bottom:1px solid #162438;
    cursor:pointer;
}

.chat-item:hover,
.chat-item.active{
    background:#13243a;
}

.chat-item-name{
    font-size:12px;
    font-weight:700;
}

.chat-item-last{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-window{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    height:58px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
}

.chat-header-name{
    font-weight:800;
    font-size:13px;
}

.chat-header-sub{
    color:var(--muted);
    font-size:10px;
}

.messages{
    flex:1;
    overflow:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
    background:#091521;
}

.message{
    max-width:75%;
    align-self:flex-start;
}

.message.mine{
    align-self:flex-end;
}

.message-author{
    color:#79aef0;
    font-size:9px;
    margin:0 0 3px 4px;
}

.message-bubble{
    background:#132238;
    border:1px solid #1d324b;
    padding:8px 10px;
    border-radius:9px;
    font-size:12px;
    line-height:1.4;
}

.message.mine .message-bubble{
    background:#163957;
    border-color:#20537b;
}

.message-time{
    color:#627995;
    font-size:8px;
    margin-top:2px;
    text-align:right;
}

.chat-input{
    border-top:1px solid var(--border);
    padding:10px;
    display:flex;
    gap:8px;
}

.chat-input input{
    flex:1;
    background:#0b1725;
    border:1px solid var(--border);
    color:white;
    border-radius:8px;
    padding:10px;
    outline:none;
}

.chat-context{
    border-left:1px solid var(--border);
    background:#0a1523;
    overflow:auto;
    padding:14px;
}

.context-title{
    font-size:11px;
    font-weight:800;
    margin-bottom:10px;
}

.context-block{
    border-bottom:1px solid var(--border);
    padding:10px 0;
}

.context-label{
    color:var(--muted);
    font-size:9px;
}

.context-value{
    font-size:12px;
    margin-top:3px;
}

/* TABLE */

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    padding:10px;
    border-bottom:1px solid var(--border);
    text-align:left;
    font-size:11px;
}

.table th{
    color:var(--muted);
    font-weight:600;
}

/* ORG */

.org{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
}

.org-ceo{
    background:#153356;
    border:1px solid #376694;
    padding:14px 24px;
    border-radius:10px;
    text-align:center;
}

.org-line{
    width:2px;
    height:20px;
    background:#29425f;
}

.directors{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    width:100%;
}

.director{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    text-align:center;
    cursor:pointer;
}

.director:hover{
    border-color:#4775a7;
}

.dept-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.dept-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
}

.dept-title{
    font-weight:800;
    font-size:12px;
}

.dept-head{
    color:#83b7f3;
    font-size:10px;
    margin-top:4px;
}

/* MODAL */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal-backdrop.open{
    display:flex;
}

.modal{
    width:min(720px,92vw);
    max-height:88vh;
    overflow:auto;
    background:#0d1928;
    border:1px solid #29405b;
    border-radius:13px;
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.modal-header{
    padding:15px 17px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-title{
    font-weight:800;
}

.modal-body{
    padding:17px;
}

.close{
    border:0;
    background:transparent;
    color:#9aacc2;
    font-size:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.field label{
    color:var(--muted);
    font-size:10px;
}

.field input,
.field textarea,
.field select{
    background:#0a1523;
    border:1px solid var(--border);
    color:white;
    padding:9px;
    border-radius:7px;
    outline:none;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:7px;
    margin-top:15px;
}

/* RESPONSIVE */

@media(max-width:1200px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .messenger{grid-template-columns:210px 1fr}
    .chat-context{display:none}
}

@media(max-width:850px){
    .sidebar{width:65px}
    .logo,.logo-sub,.sidebar-bottom{display:none}
    .nav button{font-size:0;text-align:center}
    .nav button::first-letter{font-size:18px}
    .employee-grid{grid-template-columns:1fr}
    .directors{grid-template-columns:1fr 1fr}
    .two,.three{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
    <div class="logo">ALATAU <span>NEXUS</span></div>
    <div class="logo-sub">Virtual Company OS</div>

    <nav class="nav">
        <button data-page="dashboard" class="active">📊 Dashboard</button>
        <button data-page="messenger">💬 Messenger</button>
        <button data-page="company">🏢 Компания</button>
        <button data-page="employees">👥 Сотрудники</button>
        <button data-page="crm">🎯 CRM</button>
        <button data-page="projects">📁 Проекты</button>
        <button data-page="tasks">✅ Задачи</button>
        <button data-page="finance">💰 Финансы</button>
        <button data-page="hr">🧑‍💼 HR</button>
        <button data-page="decisions">⚖️ Решения</button>
    </nav>

    <div class="sidebar-bottom">
        <div class="ceo-mini">
            <div class="avatar">OK</div>
            <div>
                <div class="ceo-mini-name">Олег Ким</div>
                <div class="ceo-mini-role">Founder & CEO</div>
            </div>
        </div>
    </div>
</aside>

<main class="main">

<header class="topbar">
    <div class="page-title" id="pageTitle">Dashboard</div>

    <div class="top-right">
        <div class="day-pill" id="dayPill">DAY 1 • 09:00</div>
        <button class="run-btn" id="runBtn" onclick="toggleSimulation()">▶ RUN</button>
        <button class="btn" onclick="nextDay()">Next Day</button>
    </div>
</header>

<div class="content" id="content"></div>

</main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle"></div>
            <button class="close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
/* =========================================================
   ALATAU NEXUS
   SINGLE SOURCE OF TRUTH
========================================================= */

const STORAGE_KEY = "alatauNexusState_v3";

const departments = [
    {id:"sales", name:"Sales", director:"e5"},
    {id:"accounts", name:"Key Accounts", director:"e5"},
    {id:"development", name:"Development", director:"e6"},
    {id:"qa", name:"QA & Engineering", director:"e6"},
    {id:"finance", name:"Finance", director:"e7"},

    {id:"operations", name:"Operations", director:"e9"},
    {id:"customer", name:"Customer Success", director:"e9"},
    {id:"marketing", name:"Marketing", director:"e5"},
    {id:"product", name:"Product", director:"e6"}
];

const directorSeed = [
    ["e5","Александр Волков","Sales Director","sales",92],

    ["e8","Мария Орлова","HR Director","hr",87],
    ["e9","Сергей Ковалёв","COO","operations",90]
];

const firstNames = [
    "Иван","Алексей","Максим","Денис","Роман","Артём","Никита","Павел",
    "Егор","Михаил","Даниил","Кирилл","Виктор","Тимур","Руслан",
    "Ольга","Елена","Наталья","Дарья","София","Анна","Ирина",
    "Алина","Марина","Ксения","Полина","Владислав","Станислав",
    "Глеб","Илья"
];

const lastNames = [
    "Иванов","Петров","Смирнов","Кузнецов","Попов","Васильев",
    "Морозов","Новиков","Фёдоров","Михайлов","Соколов","Лебедев",
    "Козлов","Орлов","Семёнов","Егоров","Павлов","Ковалёв"
];

const personalityPool = [
    "спокойный и рациональный",
    "амбициозный и инициативный",
    "осторожный и аналитичный",
    "общительный и энергичный",
    "прямолинейный и требовательный",
    "спокойный командный игрок"
];

const state = loadState();

let currentPage = "dashboard";
let currentChatId = "board";
let simulationTimer = null;

/* =========================================================
   INITIAL STATE
========================================================= */

function createInitialState(){

    const employees = [
        {
            id:"e1",
            name:"Олег Ким",
            role:"Founder & CEO",
            department:"Management",
            manager:null,
            salary:0,

            memory:[
                "Основатель Alatau Nexus.",
                "Предпочитает принимать решения на основе фактов."
            ],
            status:"active",
            authority:100
        }
    ];

    directorSeed.forEach(d=>{
        employees.push({
            id:d[0],
            name:d[1],
            role:d[2],
            department:d[3],
            manager:"e1",
            salary:850000,
            bonus:15,
            kpi:d[4],
            workload:55 + Math.floor(Math.random()*15),
            motivation:80 + Math.floor(Math.random()*15),
            loyalty:85 + Math.floor(Math.random()*12),
            skills:["Management","Strategy","Communication","Leadership"],
            personality:personalityPool[Math.floor(Math.random()*personalityPool.length)],
            responsibilities:["Управление отделом","KPI","Результаты подразделения"],
            memory:[],

function loadState(){
    try{
        const saved=localStorage.getItem(STORAGE_KEY);
        if(saved){
            const parsed=JSON.parse(saved);

            if(parsed.version===3 && parsed.employees && parsed.employees.length===36){
                return parsed;
            }
        }
    }catch(e){}

    const fresh=createInitialState();
    localStorage.setItem(STORAGE_KEY,JSON.stringify(fresh));
    return fresh;
}

function save(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

/* =========================================================
   BASIC HELPERS
========================================================= */

function employee(id){
    return state.employees.find(e=>e.id===id);
}

function client(id){
    return state.clients.find(c=>c.id===id);
}

function deal(id){
    return state.deals.find(d=>d.id===id);
}

function project(id){
    return state.projects.find(p=>p.id===id);
}

function department(id){
    return state.departments.find(d=>d.id===id);
}

function money(n){
    return new Intl.NumberFormat("ru-RU").format(Math.round(n))+" ₸";
}

function shortMoney(n){
    if(n>=1000000000)return (n/1000000000).toFixed(1)+"B";
    if(n>=1000000)return (n/1000000).toFixed(1)+"M";
    if(n>=1000)return (n/1000).toFixed(0)+"K";
    return String(Math.round(n));
}

function stageClass(stage){
    if(stage==="Won")return "green";
    if(stage==="Lost")return "red";
    if(stage==="Negotiation")return "yellow";
    return "blue";
}

function addEvent(icon,title,text){
    state.events.unshift({
        time:timeString(),
        icon,
        title,
        text
    });

    if(state.events.length>100){
        state.events.length=100;
    }
}

function timeString(){
    return String(state.hour).padStart(2,"0")+":"+String(state.minute).padStart(2,"0");
}

function getChat(id){
    return state.chats.find(c=>c.id===id);
}

function employeeChats(){
    return state.chats.filter(c=>c.type==="direct");
}

}

function updateTopbar(){
    document.getElementById("dayPill").textContent=
        "DAY "+state.day+" • "+timeString();

    const btn=document.getElementById("runBtn");

    if(state.running){
        btn.textContent="⏸ PAUSE";
        btn.classList.add("paused");
    }else{
        btn.textContent="▶ RUN";
        btn.classList.remove("paused");
    }
}

function sendMessage(){

    const input=document.getElementById("chatInput");

    if(!input)return;

    const text=input.value.trim();

    if(!text)return;

    const chat=getChat(currentChatId);

    if(!chat)return;

    chat.messages.push({
        id:"m_"+Date.now(),
        author:"e1",
        text,
        time:timeString(),
        mine:true
    });

    input.value="";

    addEvent(
        "💬",
        "CEO entered conversation",
        currentPage==="messenger"
            ? `${chat.name}: "${text.slice(0,70)}"`
            :""
    );

    save();

    /* Immediate contextual reaction */
    setTimeout(()=>{
        generateConversationReaction(chat,text);
        save();
        if(currentPage==="messenger")render();
    },350);

    renderMessages();
}

function generateConversationReaction(chat,text){

    if(chat.type==="direct"){

        const other=employee(chat.members.find(id=>id!=="e1"));

        if(!other)return;

        const response=naturalEmployeeResponse(other,text);

        chat.messages.push({
            id:"m_"+Date.now(),
            author:other.id,
            text:response,
            time:timeString()
        });

        remember(other,"Олег спросил: "+text);
        remember(other,"Я ответил Олегу: "+response);

        /* If CEO asks about a work matter, connect to business */
        processCEOConversationImpact(other,text,response);

        return;
    }

    /* Group chat: multiple people react */
    const candidates=chat.members
        .filter(id=>id!=="e1")
        .map(id=>employee(id))
        .filter(Boolean);

    const chosen=[];

    if(candidates.length){
        chosen.push(candidates[Math.floor(Math.random()*candidates.length)]);
    }

    if(candidates.length>3 && Math.random()>0.35){
        let second=candidates[Math.floor(Math.random()*candidates.length)];
        if(second.id===chosen[0]?.id){
            second=candidates.find(e=>e.id!==chosen[0].id);
        }
        if(second)chosen.push(second);
    }

    chosen.forEach((person,i)=>{

        const response=naturalEmployeeResponse(person,text);

        chat.messages.push({
            id:"m_"+Date.now()+"_"+i,
            author:person.id,
            text:response,
            time:timeString()
        });

        remember(person,"Олег написал в группе: "+text);
        remember(person,"Ответил: "+response);
    });

    addEvent(
        "💬",
        "Board discussion updated",
        "CEO вмешался в групповой разговор."
    );
}

function naturalEmployeeResponse(e,text){

    const lower=text.toLowerCase();

    /* Personal questions */
    if(
        lower.includes("жена") ||
        lower.includes("семь") ||
        lower.includes("семья") ||
        lower.includes("дом") ||
        lower.includes("вчера") && (
            lower.includes("вечер") ||
            lower.includes("дома")
        )
    ){

        const answers=[
            "Да, всё нормально. Вчера спокойно посидели дома, наконец-то без рабочих звонков.",
            "Всё хорошо 🙂 Вчера удалось нормально провести вечер вместе.",
            "Да, нормально. Был насыщенный день, но вечером всё спокойно.",
            "Всё хорошо, спасибо. Иногда полезно вообще не говорить о работе вечером."
        ];

        return answers[e.id.charCodeAt(1)%answers.length];
    }

    if(
        lower.includes("как ты") ||
        lower.includes("как дела") ||
        lower.includes("настроение")
    ){

        if(e.workload>85){
            return "Честно? Немного перегружен сегодня. Но ситуация под контролем.";
        }

        if(e.motivation>85){
            return "Хорошо. Сегодня настроение отличное, думаю, продуктивный день получится.";
        }

        return "Нормально. Есть несколько задач, но ничего критичного.";
    }

    /* Work context */
    if(
        lower.includes("сделк") ||
        lower.includes("клиент") ||
        lower.includes("crm") ||
        lower.includes("продаж") ||
        lower.includes("nova") ||
        lower.includes("kaspi")
    ){

        const myDeals=state.deals.filter(d=>d.owner===e.id);

        if(myDeals.length){

            const d=myDeals[0];
            const c=client(d.client);

            return `Сейчас у меня ${myDeals.length} активных сделок. По ${c?.name || "клиенту"} мы на стадии ${d.stage}. Следующее действие — ${d.next.toLowerCase()}.`;
        }

        return "По моим текущим задачам всё под контролем. Если хочешь, могу отдельно пройтись по конкретному вопросу.";
    }

    if(
        lower.includes("проект") ||
        lower.includes("задач")
    ){

        const tasks=state.tasks.filter(t=>t.owner===e.id && t.status!=="Done");

        if(tasks.length){
            return `Сейчас у меня ${tasks.length} открытых задач. Самая важная — «${tasks[0].title}».`;
        }

        return "По задачам сейчас без критичных проблем.";
    }

    if(
        lower.includes("зарплат") ||
        lower.includes("деньг") ||
        lower.includes("бонус")
    ){
        return `По моим текущим условиям всё понятно. Если ты хочешь обсудить компенсацию, можем отдельно поговорить.`;
    }

    if(
        lower.includes("почему") ||
        lower.includes("объясни") ||
        lower.includes("что происходит")
    ){

        if(e.workload>85){
            return "Основная проблема сейчас — нагрузка. Несколько задач наложились одновременно, поэтому приходится выбирать приоритеты.";
        }

        return `Если говорить по моей зоне ответственности: сейчас главное — держать задачи под контролем и не допустить, чтобы проблемы дошли до клиентов.`;
    }

    /* Generic but contextual */
    const responses=[
        "Понял тебя. Я подумаю над этим с учётом того, что сейчас происходит у меня в работе.",
        "Да, понимаю. С моей стороны ситуация сейчас под контролем.",
        "Хороший вопрос. Если коротко — сейчас всё нормально, но есть несколько вещей, за которыми я слежу.",
        "Понял. Давай я отвечу по сути: критичной проблемы сейчас нет."
    ];

    return responses[(e.id.charCodeAt(1)+text.length)%responses.length];
}

function processCEOConversationImpact(e,text,response){

    const lower=text.toLowerCase();

    if(lower.includes("почему") && lower.includes("crm")){
        e.motivation=Math.min(100,e.motivation+1);
    }

    if(lower.includes("спасибо")){
        e.motivation=Math.min(100,e.motivation+2);
    }

    if(
        lower.includes("сделк") ||
        lower.includes("клиент")
    ){
        addEvent(
            "👤",
            "CEO spoke with "+e.name,
            "Обсуждение связано с клиентской работой."
        );
    }
}

function remember(e,text){
    e.memory.push(text);

    if(e.memory.length>20){
        e.memory.shift();
    }
}

function changeKPI(id){

    const e=employee(id);

    const value=prompt("Новый KPI (0-100):",e.kpi);

    if(value===null)return;

    const n=Math.max(0,Math.min(100,Number(value)));

    if(!Number.isFinite(n))return;

    e.kpi=n;

    addEvent("👤","KPI changed",`${e.name}: KPI установлен на ${n}%.`);

    save();
    closeModal();

}

function changeSalary(id){

    const e=employee(id);

    const value=prompt("Новая зарплата:",e.salary);

    if(value===null)return;

    const n=Math.max(0,Number(value));

    if(!Number.isFinite(n))return;

    const difference=n-e.salary;

    e.salary=n;

    state.finance.payroll+=difference;
    state.finance.expenses+=difference;
    state.finance.profit-=difference;

    addEvent(
        "💰",
        "Salary changed",
        `${e.name}: ${money(e.salary)}.`
    );

    remember(e,`CEO изменил мою зарплату на ${money(n)}.`);

    save();
    closeModal();
    render();
}

function fireEmployee(id){

    const e=employee(id);

    if(!e)return;

    if(!confirm(`Уволить ${e.name}?`))return;

    const replacementDeals=state.deals.filter(d=>d.owner===id);

    replacementDeals.forEach(d=>{
        d.owner=e.manager || "e5";
    });

    state.tasks
        .filter(t=>t.owner===id && t.status!=="Done")
        .forEach(t=>{
            t.owner=e.manager || "e5";
        });

    state.employees=state.employees.filter(x=>x.id!==id);

    state.finance.expenses=Math.max(
        0,
        state.finance.expenses-e.salary
    );

    state.finance.profit+=e.salary;

    addEvent(
        "🔴",
        "Employee dismissed",
        `${e.name} был уволен. Активные задачи и сделки переданы руководителю.`
    );

    save();
    closeModal();
    render();
}

function advanceDeal(id){

    const d=deal(id);

    const stages=["Lead","Contacted","Meeting","Proposal","Negotiation","Won"];

    const i=stages.indexOf(d.stage);

    if(i<0 || i>=stages.length-2)return;

    d.stage=stages[i+1];
    d.prob=Math.min(95,d.prob+8);

    addEvent(
        "🎯",
        "Deal advanced",
        `${d.name}: ${d.stage}.`
    );

    if(d.stage==="Negotiation"){
        createDecisionForDeal(d);
    }

    save();
    closeModal();
    render();
}

function winDeal(id){

    const d=deal(id);

    d.stage="Won";
    d.prob=100;

    state.finance.revenue+=d.value;
    state.finance.cash+=d.value;
    state.finance.profit+=d.value;

    const c=client(d.client);

    if(c)c.health=Math.min(100,c.health+8);

}

function loseDeal(id){

    const d=deal(id);

    d.stage="Lost";
    d.prob=0;

    const c=client(d.client);

    if(c)c.health=Math.max(0,c.health-10);

    state.companyHealth=Math.max(0,state.companyHealth-1);

    addEvent(

    save();

}

function makeDecision(id,effect,label){

    const d=state.decisions.find(x=>x.id===id);

    if(!d)return;

    d.status="resolved";

    if(effect==="deal_prob_up"){

        const active=state.deals.find(x=>x.stage==="Negotiation");

        if(active){
            active.prob=Math.min(95,active.prob+12);
        }

        state.companyHealth=Math.min(100,state.companyHealth+1);
    }

    if(effect==="balanced"){
        state.companyHealth=Math.min(100,state.companyHealth+1);
    }

    if(effect==="deal_prob_down"){

        const active=state.deals.find(x=>x.stage==="Negotiation");

        if(active){
            active.prob=Math.max(5,active.prob-12);
        }

        state.companyHealth=Math.max(0,state.companyHealth-1);
    }

    addEvent(
        "⚖️",
        "CEO decision",
        `${d.title}: ${label}.`
    );

    state.employees
        .filter(e=>e.role.includes("Director"))
        .forEach(e=>{
            remember(e,`CEO принял решение: ${label}.`);
        });

    save();
    render();
}

/* =========================================================
   SIMULATION ENGINE
========================================================= */

function toggleSimulation(){

    state.running=!state.running;

    if(state.running){

        simulationTimer=setInterval(simulationTick,4000);

    }else{

        clearInterval(simulationTimer);
        simulationTimer=null;
    }

    save();
    updateTopbar();
}

function simulationTick(){

    advanceTime(30);

    processEmployees();
    processDeals();
    processTasks();
    processProjects();
    processFinance();
    maybeGenerateConversation();
    updateCompanyHealth();

    save();

    if(currentPage==="dashboard" ||
       currentPage==="messenger" ||
       currentPage==="crm" ||
       currentPage==="tasks" ||
       currentPage==="projects"){
        render();
    }else{
        updateTopbar();
    }
}

function advanceTime(minutes){

    state.minute+=minutes;

    while(state.minute>=60){
        state.minute-=60;
        state.hour++;
    }

    if(state.hour>=24){
        state.hour=0;
        state.day++;
    }
}

function nextDay(){

    state.day++;
    state.hour=9;
    state.minute=0;

    processEmployees();
    processDeals();
    processTasks();
    processProjects();
    processFinance();
    generateDailyEvents();
    updateCompanyHealth();

    save();
    render();
}

function processEmployees(){

    state.employees.forEach(e=>{

        if(e.id==="e1")return;

        /* Workload naturally falls a little when employees work */
        if(e.workload>45){
            e.workload=Math.max(25,e.workload-2);
        }

        /* Motivation reacts to workload */
        if(e.workload>90){
            e.motivation=Math.max(30,e.motivation-2);
        }else if(e.kpi>80){
            e.motivation=Math.min(100,e.motivation+1);
        }

        /* KPI responds slowly to performance */
        if(e.workload>90){
            e.kpi=Math.max(30,e.kpi-1);
        }

    });
}

function processDeals(){

    state.deals.forEach(d=>{

        if(["Won","Lost"].includes(d.stage))return;

        const owner=employee(d.owner);

        if(!owner)return;

        /* High workload slows deal progress */
        if(owner.workload>90){
            d.prob=Math.max(5,d.prob-1);
            return;
        }

        if(state.day%3===0 && d.prob>30){
            d.prob=Math.min(95,d.prob+2);
        }

        if(d.stage==="Lead" && d.prob>30 && Math.random()>0.7){
            d.stage="Contacted";
            d.next="Discovery call";

            addEvent(
                "🎯",
                "CRM activity",
                `${d.name} moved to Contacted.`
            );
        }

    });
}

function processTasks(){

    state.tasks.forEach(t=>{

        if(t.status==="Done")return;

        const e=employee(t.owner);

        if(!e)return;

        if(e.workload>95)return;

        if(Math.random()>0.7){

            t.status="In Progress";

            e.workload=Math.min(100,e.workload+2);
        }

        if(Math.random()>0.93){

            t.status="Done";

            e.kpi=Math.min(100,e.kpi+1);
            e.workload=Math.max(0,e.workload-5);

            addEvent(
                "✅",
                "Employee completed task",
                `${e.name} завершил: ${t.title}.`
            );
        }
    });
}

function processProjects(){

    state.projects.forEach(p=>{

        if(p.status==="Done")return;

        const manager=employee(p.manager);

        if(!manager)return;

        let speed=1;

        if(manager.kpi>85)speed+=0.5;
        if(manager.workload>90)speed-=0.6;

        p.progress=Math.min(100,p.progress+Math.max(0,speed));

        if(p.progress>=100){

            p.status="Done";

            addEvent(
                "📁",
                "Project completed",
                `${p.name} завершён.`
            );
        }
    });
}

function processFinance(){

    const payroll=state.employees
        .filter(e=>e.id!=="e1")
        .reduce((s,e)=>s+e.salary,0);

    /* Daily operating expense */
    const dailyPayroll=payroll/30;

    state.finance.payroll=payroll;
    state.finance.expenses+=dailyPayroll;
    state.finance.cash-=dailyPayroll;
    state.finance.profit-=dailyPayroll;
}

function updateCompanyHealth(){

    const avgKpi=average(state.employees.map(e=>e.kpi));
    const avgMotivation=average(state.employees.map(e=>e.motivation));

    const overdue=state.tasks.filter(t=>t.status!=="Done" && t.due<=0).length;

    const riskDeals=state.deals.filter(d=>d.prob<25 && !["Won","Lost"].includes(d.stage)).length;

    let health=(
        avgKpi*.35+
        avgMotivation*.30+
        (100-riskDeals*8)*.2+
        (100-overdue*5)*.15
    );

    state.companyHealth=Math.max(0,Math.min(100,Math.round(health)));
}

function generateDailyEvents(){

    const overloaded=state.employees
        .filter(e=>e.workload>88 && e.id!=="e1");

    if(overloaded.length){

        const e=overloaded[Math.floor(Math.random()*overloaded.length)];

        addEvent(
            "⚠️",
            "Workload warning",
            `${e.name} перегружен. Workload ${e.workload}%.`
        );
    }

    const dealAtRisk=state.deals
        .find(d=>d.prob<30 && !["Won","Lost"].includes(d.stage));

    if(dealAtRisk){

        addEvent(
            "🎯",
            "Deal at risk",
            `${dealAtRisk.name} имеет вероятность ${dealAtRisk.prob}%.`
        );
    }

    addEvent(
        "🌅",
        "New company day",
        `Компания начала Day ${state.day}.`
    );
}

function maybeGenerateConversation(){

    /*
       Conversations are intentionally rare.
       No spam. A conversation happens when there is
       a business reason or an active situation.
    */

    if(Math.random()>0.35)return;

    const director=state.employees.find(
        e=>e.role.includes("Director") && e.id!=="e1"
    );

    if(!director)return;

    const chat=getChat("chat_"+director.id);

    if(!chat)return;

    const openTasks=state.tasks.filter(
        t=>t.owner===director.id && t.status!=="Done"
    );

    if(openTasks.length){

        chat.messages.push({
            id:"m_"+Date.now(),
            author:director.id,
            text:`У меня сейчас ${openTasks.length} открытых задач. Основная — ${openTasks[0].title.toLowerCase()}.`,
            time:timeString()
        });

        addEvent(
            "💬",
            "Director activity",
            `${director.name} обновил личный статус.`
        );

        return;
    }

    if(director.workload>85){

        chat.messages.push({
            id:"m_"+Date.now(),
            author:director.id,
            text:"Сегодня довольно плотный день. Есть несколько вопросов, которые нужно закрыть до вечера.",
            time:timeString()
        });

        addEvent(
            "💬",
            "Director activity",
            `${director.name} сообщил о высокой загрузке.`
        );
    }
}

function generateBriefing(){

    const result=[];

    const activeDeals=state.deals.filter(
        d=>!["Won","Lost"].includes(d.stage)
    );

    const pipeline=activeDeals.reduce((s,d)=>s+d.value,0);

    result.push(
        `Pipeline сейчас составляет ${shortMoney(pipeline)}.`
    );

    const overdue=state.tasks.filter(
        t=>t.status!=="Done" && t.due<=0
    ).length;

    if(overdue){
        result.push(
            `${overdue} задач требуют внимания из-за срока.`
        );
    }else{
        result.push(
            `Критических просроченных задач сейчас нет.`
        );
    }

    const overloaded=state.employees.filter(
        e=>e.workload>85 && e.id!=="e1"
    );

    if(overloaded.length){
        result.push(
            `${overloaded.length} сотрудников работают с высокой нагрузкой.`
        );
    }

    const decisions=state.decisions.filter(d=>d.status==="pending");

    if(decisions.length){
        result.push(
            `${decisions.length} управленческих решения ожидают CEO.`
        );
    }

    const project=state.projects
        .filter(p=>p.status!=="Done")
        .sort((a,b)=>a.progress-b.progress)[0];

    if(project && project.progress<50){
        result.push(
            `Проект ${project.name} пока идёт медленно: ${project.progress}% готовности.`
        );
    }

    return result.slice(0,5);
}

/* =========================================================
   MODAL
========================================================= */

function openModal(title,body){

    document.getElementById("modalTitle").textContent=title;
    document.getElementById("modalBody").innerHTML=body;
    document.getElementById("modalBackdrop").classList.add("open");
}

function closeModal(){
    document.getElementById("modalBackdrop").classList.remove("open");
}

document.getElementById("modalBackdrop").addEventListener("click",e=>{
    if(e.target.id==="modalBackdrop"){
        closeModal();
    }
});

/* =========================================================
   UTILITIES
========================================================= */

function initials(name){

    return name
        .split(" ")
        .slice(0,2)
        .map(x=>x[0])
        .join("")
        .toUpperCase();
}

function average(arr){

    if(!arr.length)return 0;

    return Math.round(
        arr.reduce((a,b)=>a+b,0)/arr.length
    );
}

function escapeHtml(str){

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttr(str){
    return String(str).replaceAll("'","\\'");
}

function eventHTML(e){

    return `
        <div class="feed-item">

            <div class="feed-icon">
                ${e.icon}
            </div>

            <div class="feed-main">

                <div class="feed-title">
                    ${escapeHtml(e.title)}
                </div>

                <div class="feed-text">
                    ${escapeHtml(e.text)}
                </div>

            </div>

            <div class="feed-time">
                ${e.time}
            </div>

        </div>
    `;
}
