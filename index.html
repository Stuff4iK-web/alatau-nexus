<div class="app">

  </aside>
  <main class="main">
    <header class="topbar"><div><div id="pageTitle" class="title">Dashboard</div><div id="pageSubtitle" class="subtitle">Центр управления компанией</div></div><div class="top-actions"><div id="timePill" class="pill"></div><div id="healthPill" class="pill"></div><div class="speed"><button id="sp1" onclick="setSpeed(1)">×1</button><button id="sp2" onclick="setSpeed(2)">×2</button><button id="sp5" onclick="setSpeed(5)">×5</button></div><button id="runBtn" class="run" onclick="toggleRun()">▶ Запустить</button></div></header>

<script>
'use strict';
const APP_KEY='alatauNexusFinalV1';
const CURRENT_USER='ceo';
const stages=['Lead','Contacted','Discovery','Proposal','Negotiation','Won','Lost'];
const stageNames={Lead:'Лид',Contacted:'Контакт',Discovery:'Диагностика',Proposal:'Предложение',Negotiation:'Переговоры',Won:'Выиграна',Lost:'Проиграна'};
const navGroups=[
 {label:'УПРАВЛЕНИЕ',items:[['dashboard','Dashboard','▦'],['company','Компания','◈'],['employees','Сотрудники','●'],['departments','Отделы','◇']]},
 {label:'БИЗНЕС',items:[['crm','CRM','⌁'],['projects','Проекты','▣'],['tasks','Задачи','☑'],['finance','Финансы','₸']]},
 {label:'ЛЮДИ',items:[['hr','HR / Найм','♙'],['messenger','Messenger','◌'],['observer','Observer','◉']]},
 {label:'CEO',items:[['strategy','Стратегия','◎'],['decisions','Решения','⚖'],['settings','Система','⚙']]}
];
const pageMeta={dashboard:['Панель управления','Центр управления компанией'],company:['Компания','Оргструктура и состояние бизнеса'],employees:['Сотрудники','Люди, KPI, мотивация и управление'],departments:['Отделы','10 подразделений и их ответственность'],crm:['CRM','Лиды, клиенты, сделки и воронка'],projects:['Проекты','Портфель проектов и исполнение'],tasks:['Задачи','Рабочий поток компании'],finance:['Финансы','Деньги, прибыль и бюджет'],hr:['HR / Найм','Кандидаты, вакансии и кадровые решения'],messenger:['Мессенджер','Внутренние разговоры и память'],observer:['Наблюдатель','Причины, решения и последствия'],strategy:['Стратегия','Цели компании и OKR'],decisions:['Решения','Управленческие решения CEO'],settings:['Система','Сохранение, скорость и сброс']};
let currentPage='dashboard', simulationTimer=null, speed=1, selectedChat='board', employeeFilter='all', dealFilter='all', chatDraft='';

function money(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n))+' ₸'}
function moneyShort(n){const a=Math.abs(n); if(a>=100000000)return (n/1000000).toFixed(1)+' млн'; if(a>=1000000)return (n/1000000).toFixed(1)+' млн'; if(a>=1000)return (n/1000).toFixed(0)+' тыс'; return String(Math.round(n))}
function pct(n){return Math.round(n)+'%'}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function initials(name){return name.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function avg(list){return list.length?Math.round(list.reduce((a,b)=>a+b,0)/list.length):0}
function nowLabel(){return 'День '+state.company.day+' · '+String(state.company.hour).padStart(2,'0')+':'+String(state.company.minute).padStart(2,'0')}
function dateKey(){return state.company.day+'-'+String(state.company.hour).padStart(2,'0')}
function employee(id){return state.employees.find(e=>e.id===id)}
function activeEmployees(){return state.employees.filter(e=>e.status==='active')}
function department(id){return state.departments.find(d=>d.id===id)}
function client(id){return state.clients.find(c=>c.id===id)}
function deal(id){return state.deals.find(d=>d.id===id)}
function project(id){return state.projects.find(p=>p.id===id)}
function task(id){return state.tasks.find(t=>t.id===id)}
function pendingDecisions(){return state.decisions.filter(d=>d.status==='pending')}
function addEvent(icon,title,text,category='system',actor='CEO',severity='info'){
  state.events.unshift({id:'ev'+state.company.nextId++,day:state.company.day,hour:state.company.hour,minute:state.company.minute,icon,title,text,category,actor,severity});
  state.events=state.events.slice(0,220);
}
function remember(e,text){e.memory.unshift({day:state.company.day,time:timeLabel(),text});e.memory=e.memory.slice(0,30)}
function timeLabel(){return String(state.company.hour).padStart(2,'0')+':'+String(state.company.minute).padStart(2,'0')}
function pushMessage(chatId,author,text,kind='employee'){
  const c=state.chats.find(x=>x.id===chatId); if(!c)return;
  c.messages.push({id:'m'+state.company.nextId++,author,text,time:timeLabel(),day:state.company.day,kind});
  c.updated=state.company.day*1440+state.company.hour*60+state.company.minute;
  c.last=text;
  if(c.messages.length>100)c.messages.shift();
}
function toast(text,type=''){
  const el=document.createElement('div');el.className='toast '+type;el.textContent=text;document.getElementById('toastWrap').appendChild(el);setTimeout(()=>el.remove(),2500)

function loadState(){try{const raw=localStorage.getItem(APP_KEY);if(!raw)return seedState();const s=JSON.parse(raw);return normalizeState(s)}catch(e){return seedState()}}
function normalizeState(s){
  const fresh=seedState();
  for(const k of Object.keys(fresh)){if(s[k]===undefined)s[k]=fresh[k]}
  if(!Array.isArray(s.employees)||s.employees.length<36)s.employees=fresh.employees;
  s.company.running=false;s.settings=s.settings||{};s.selectedChat=s.selectedChat||'board';
  s.employees.forEach(e=>{e.memory=Array.isArray(e.memory)?e.memory:[];e.relationships=e.relationships||{};e.skills=e.skills||[];e.responsibilities=e.responsibilities||[];e.personal=e.personal||''});
  return s;
}

function stopTimer(){state.company.running=false;clearInterval(simulationTimer);simulationTimer=null;save();updateTopbar()}
function updateTopbar(){document.getElementById('timePill').textContent=nowLabel();document.getElementById('healthPill').textContent='Здоровье '+state.company.health+'%';document.getElementById('healthPill').className='pill '+(state.company.health>=80?'good-text':state.company.health<60?'danger-text':'warning-text');const b=document.getElementById('runBtn');b.textContent=state.company.running?'Ⅱ Пауза':'▶ Запустить';b.classList.toggle('paused',state.company.running);['1','2','5'].forEach(x=>document.getElementById('sp'+x).classList.toggle('active',Number(x)===speed))}
function render(){updateTopbar();document.getElementById('pageTitle').textContent=pageMeta[currentPage][0];document.getElementById('pageSubtitle').textContent=pageMeta[currentPage][1];renderPage()}

function stat(label,value,sub=''){return `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function renderDashboard(){
  const active=activeEmployees().filter(e=>e.type!=='ceo');
  const rev=state.finance.revenue, profit=state.finance.profit;const pipeline=state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).reduce((a,d)=>a+d.value*d.prob/100,0);const overdue=state.tasks.filter(t=>t.status!=='Done'&&t.due<0).length;const pending=pendingDecisions().length;const avgK=avg(active.map(e=>e.kpi));
  const brief=generateBriefing();
  return `<div class="grid stats">${stat('Выручка',moneyShort(rev)+' ₸','месяц')}${stat('Прибыль',moneyShort(profit)+' ₸',profit>=0?'операционная':'отрицательная')}${stat('Pipeline',moneyShort(pipeline)+' ₸','weighted')}${stat('Cash',moneyShort(state.finance.cash)+' ₸','доступно')}${stat('Сотрудники',active.length,'активных')}${stat('Health',state.company.health+'%',avgK+'% средний KPI')}${stat('Решения',pending,pending?'ждут CEO':'всё закрыто')}</div>
  <div class="section-title">Morning Briefing · ${nowLabel()}</div>
  <div class="grid split"><div class="card briefing"><h2>Сегодняшний фокус</h2><p>Компания работает в симуляционном режиме. Все ключевые показатели связаны с текущим состоянием людей, CRM, проектов и денег.</p><div class="brief-list">${brief.map(x=>`<div class="brief-item"><span class="dot"></span><span>${esc(x)}</span></div>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="go('decisions')">Открыть решения</button><button class="btn" onclick="go('messenger')">Открыть Messenger</button><button class="btn" onclick="go('observer')">Наблюдать</button></div></div>
  <div class="card"><div class="section-title" style="margin:0 0 8px">Ключевые риски</div>${riskRows()}</div></div>
  <div class="section-title">Живая активность компании</div><div class="grid split2"><div class="card"><div class="feed">${state.events.slice(0,10).map(eventHTML).join('')}</div></div><div class="card"><div class="section-title" style="margin:0 0 8px">Коммерческий обзор</div>${commercialSnapshot()}</div></div>`
}
function riskRows(){const risks=[];const atRisk=state.deals.filter(d=>!['Won','Lost'].includes(d.stage)&&d.prob<30);if(atRisk.length)risks.push(`<div class="notice"><b class="danger-text">${atRisk.length} сделки</b> имеют вероятность ниже 30%.</div>`);const overloaded=activeEmployees().filter(e=>e.workload>85&&e.type!=='ceo');if(overloaded.length)risks.push(`<div class="notice"><b class="warning-text">${overloaded.length} сотрудников</b> перегружены.</div>`);const pr=state.projects.filter(p=>p.risk>30&&p.status!=='Done');if(pr.length)risks.push(`<div class="notice"><b class="danger-text">${pr.length} проекта</b> имеют высокий delivery risk.</div>`);if(!risks.length)risks.push('<div class="notice"><b class="good-text">Критических рисков нет.</b> Система всё равно продолжает мониторинг.</div>');return risks.join('<div style="height:7px"></div>')}
function commercialSnapshot(){return `<div class="small muted">Pipeline by stage</div><div style="margin:9px 0" class="pipeline-bar">${stages.filter(s=>!['Won','Lost'].includes(s)).map(s=>{const v=state.deals.filter(d=>d.stage===s).reduce((a,d)=>a+d.value,0);return `<span style="flex:${Math.max(1,v/1000000)};background:${s==='Negotiation'?'var(--yellow)':s==='Proposal'?'var(--blue)':'#355472'}"></span>`}).join('')}</div><div class="grid" style="gap:5px">${stages.map(s=>`<div style="display:flex;justify-content:space-between;font-size:10px"><span>${stageNames[s]}</span><b>${moneyShort(state.deals.filter(d=>d.stage===s).reduce((a,d)=>a+d.value,0))} ₸</b></div>`).join('')}</div>`}
function eventHTML(e){return `<div class="feed-item"><div class="feed-icon">${e.icon}</div><div class="feed-main"><div class="feed-title">${esc(e.title)}</div><div class="feed-text">${esc(e.text)}</div></div><div class="feed-time">${e.day}д ${String(e.hour).padStart(2,'0')}:${String(e.minute).padStart(2,'0')}</div></div>`}
function generateBriefing(){const a=[];const hot=state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).sort((x,y)=>y.value*y.prob-x.value*y.prob)[0];if(hot)a.push(`Главная коммерческая точка: ${hot.name} · ${stageNames[hot.stage]} · вероятность ${hot.prob}%.`);const pr=state.projects.filter(p=>p.status!=='Done').sort((x,y)=>y.risk-x.risk)[0];if(pr)a.push(`Проект ${pr.name} требует внимания: delivery risk ${pr.risk}%.`);const over=state.tasks.filter(t=>t.status!=='Done'&&t.due<0).length;if(over)a.push(`${over} задач уже просрочены — нагрузка и приоритеты нужно пересмотреть.`);else a.push('Просроченных задач нет; команда сохраняет операционный контроль.');const p=pendingDecisions().length;if(p)a.push(`${p} управленческих решения ожидают CEO.`);const low=activeEmployees().filter(e=>e.motivation<65&&e.type!=='ceo').length;if(low)a.push(`${low} сотрудника имеют мотивацию ниже 65%.`);else a.push('Мотивация команды стабильная.');return a.slice(0,5)}

function renderCompany(){const dirs=state.employees.filter(e=>e.type==='director');const ceo=employee('ceo');return `<div class="grid split"><div class="card"><div class="section-title" style="margin:0 0 11px">Организационная структура</div><div class="org"><div class="org-ceo" onclick="openEmployee('ceo')"><div class="avatar" style="margin:auto">ОК</div><b style="display:block;margin-top:6px">${ceo.name}</b><span class="small muted">Founder & CEO</span></div><div class="org-line"></div><div class="director-row">${dirs.map(renderDirectorCard).join('')}</div></div></div><div class="card"><div class="section-title" style="margin:0 0 10px">Company State</div>${companyStateHTML()}</div></div>`}
function renderDirectorCard(e){const depts=state.departments.filter(d=>d.directorId===e.id);return `<div class="director-card" onclick="openEmployee('${e.id}')"><div style="display:flex;justify-content:center"><div class="avatar small">${initials(e.name)}</div></div><div style="text-align:center;margin-top:6px"><b style="font-size:11px">${esc(e.name)}</b><div class="small muted">${esc(e.role)}</div></div><div class="small muted" style="margin-top:7px">${depts.map(d=>d.name).join(' · ')}</div><div style="margin-top:7px"><div class="progress"><span style="width:${e.kpi}%"></span></div><div class="small muted" style="margin-top:3px">KPI ${e.kpi}% · load ${e.workload}%</div></div></div>`}
function companyStateHTML(){return `<div class="grid" style="gap:7px">${[['Cash',money(state.finance.cash)],['Revenue',money(state.finance.revenue)],['Operating expenses',money(state.finance.operatingExpenses)],['Profit',money(state.finance.profit)],['Reputation',state.company.reputation+'%'],['Morale',avg(activeEmployees().map(e=>e.motivation))+'%'],['Pipeline weighted',money(state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).reduce((a,d)=>a+d.value*d.prob/100,0))]].map(x=>`<div style="display:flex;justify-content:space-between;font-size:10px"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="section-title">Health factors</div>${healthFactors()}`}
function healthFactors(){const k=avg(activeEmployees().map(e=>e.kpi));const m=avg(activeEmployees().map(e=>e.motivation));const risk=state.deals.filter(d=>!['Won','Lost'].includes(d.stage)&&d.prob<30).length;const overdue=state.tasks.filter(t=>t.status!=='Done'&&t.due<0).length;return [['KPI',k],['Motivation',m],['Commercial risk',Math.max(0,100-risk*9)],['Operations',Math.max(0,100-overdue*8)]].map(x=>`<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:9px"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="progress" style="margin-top:4px"><span style="width:${x[1]}%"></span></div></div>`).join('')}

function renderEmployees(){const q=employeeFilter==='all'?activeEmployees().filter(e=>e.type!=='ceo'):activeEmployees().filter(e=>e.type===employeeFilter);return `<div class="toolbar"><input id="empSearch" placeholder="Поиск сотрудника…" oninput="filterEmployees(this.value)"><select onchange="employeeFilter=this.value;renderPage()"><option value="all" ${employeeFilter==='all'?'selected':''}>Все</option><option value="director" ${employeeFilter==='director'?'selected':''}>Директора</option><option value="manager" ${employeeFilter==='manager'?'selected':''}>Руководители</option><option value="employee" ${employeeFilter==='employee'?'selected':''}>Сотрудники</option></select><button class="btn primary" onclick="openCreateEmployee()">+ Сотрудник</button></div><div id="employeeList" class="employee-grid">${q.map(empCard).join('')}</div>`}
function filterEmployees(term){const t=term.toLowerCase();document.getElementById('employeeList').innerHTML=activeEmployees().filter(e=>e.type!=='ceo'&&(e.name.toLowerCase().includes(t)||e.role.toLowerCase().includes(t)||e.department.toLowerCase().includes(t))).map(empCard).join('')}
function empCard(e){const d=department(e.department);return `<div class="emp"><div class="emp-head"><div class="avatar small">${initials(e.name)}</div><div style="min-width:0"><div class="emp-name">${esc(e.name)}</div><div class="emp-role">${esc(e.role)}</div></div></div><div style="margin-top:7px"><span class="badge blue">${esc(d?.name||e.department)}</span> ${e.workload>85?'<span class="badge red">перегрузка</span>':e.motivation<65?'<span class="badge yellow">мотивация</span>':''}</div><div class="emp-meta"><div class="meta"><span>KPI</span><b>${e.kpi}%</b></div><div class="meta"><span>Motivation</span><b>${e.motivation}%</b></div><div class="meta"><span>Workload</span><b>${e.workload}%</b></div><div class="meta"><span>Salary</span><b>${moneyShort(e.salary)} ₸</b></div></div><div class="emp-actions"><button class="btn" onclick="openEmployee('${e.id}')">Профиль</button><button class="btn" onclick="startChat('${e.id}')">Написать</button></div></div>`}

function renderDepartments(){return `<div class="dept-grid">${state.departments.map(d=>{const head=employee(d.managerId);const members=activeEmployees().filter(e=>e.department===d.id);const dir=employee(d.directorId);return `<div class="card"><div class="dept-head"><div><b style="font-size:12px">${esc(d.name)}</b><div class="small muted">${esc(d.mission)}</div></div><span class="badge blue">${members.length} людей</span></div><div class="small" style="margin-top:9px">Director: <span class="link" onclick="openEmployee('${dir.id}')">${esc(dir.name)}</span></div><div class="small" style="margin-top:4px">Manager: ${head?`<span class="link" onclick="openEmployee('${head.id}')">${esc(head.name)}</span>`:'—'}</div><div class="dept-list">${members.slice(0,8).map(e=>`<span class="person-chip">${esc(e.name)}</span>`).join('')}</div></div>`}).join('')}</div>`}

function renderCRM(){const active=state.deals.filter(d=>dealFilter==='all'||d.stage===dealFilter);return `<div class="toolbar"><select onchange="dealFilter=this.value;renderPage()"><option value="all">Все стадии</option>${stages.map(s=>`<option value="${s}" ${dealFilter===s?'selected':''}>${stageNames[s]}</option>`).join('')}</select><button class="btn primary" onclick="openCreateDeal()">+ Сделка</button><button class="btn" onclick="openCRMAnalytics()">Аналитика</button></div><div class="card" style="margin-bottom:10px"><div class="grid triple"><div><span class="small muted">Total pipeline</span><div style="font-size:17px;font-weight:900">${money(state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).reduce((a,d)=>a+d.value,0))}</div></div><div><span class="small muted">Weighted pipeline</span><div style="font-size:17px;font-weight:900">${money(state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).reduce((a,d)=>a+d.value*d.prob/100,0))}</div></div><div><span class="small muted">Win rate</span><div style="font-size:17px;font-weight:900">${calcWinRate()}%</div></div></div></div><div class="crm-board">${stages.map(s=>`<div class="crm-col"><h3><span>${stageNames[s]}</span><span class="badge">${state.deals.filter(d=>d.stage===s).length}</span></h3>${active.filter(d=>d.stage===s).map(dealCard).join('')||'<div class="empty">Пусто</div>'}</div>`).join('')}</div>`}
function dealCard(d){const c=client(d.clientId),o=employee(d.ownerId);return `<div class="deal" onclick="openDeal('${d.id}')"><div class="deal-name">${esc(d.name)}</div><div class="deal-client">${esc(c?.name||'—')}</div><div class="deal-value">${moneyShort(d.value)} ₸</div><div class="deal-meta"><span>${esc(o?.name||'—')}</span><span>${d.prob}%</span></div><div class="progress" style="margin-top:6px"><span style="width:${d.prob}%"></span></div><div class="small muted" style="margin-top:6px">${esc(d.next)}</div></div>`}
function calcWinRate(s=state){const closed=s.deals.filter(d=>['Won','Lost'].includes(d.stage));if(!closed.length)return 0;return Math.round(s.deals.filter(d=>d.stage==='Won').length/closed.length*100)}

function renderProjects(){return `<div class="toolbar"><button class="btn primary" onclick="openCreateProject()">+ Проект</button><button class="btn" onclick="openProjectAnalytics()">Portfolio view</button></div><div class="project-grid">${state.projects.map(p=>{const m=employee(p.managerId),c=p.clientId&&client(p.clientId);return `<div class="project"><div style="display:flex;justify-content:space-between"><h3>${esc(p.name)}</h3><span class="badge ${p.risk>30?'red':p.risk>20?'yellow':'green'}">risk ${p.risk}%</span></div><div class="small muted" style="margin-top:4px">${c?esc(c.name):'Internal'} · ${esc(m?.name||'—')}</div><div class="line"><span>Progress</span><b>${p.progress}%</b></div><div class="progress"><span style="width:${p.progress}%"></span></div><div class="line"><span>Budget</span><b>${moneyShort(p.budget)} ₸</b></div><div class="line"><span>Deadline</span><b>Day ${p.deadline}</b></div><div class="actions" style="margin-top:7px"><button class="btn" onclick="openProject('${p.id}')">Открыть</button><button class="btn" onclick="projectRiskAction('${p.id}')">Риск</button></div></div>`}).join('')}</div>`}

function renderTasks(){const cols=[['Open','Открытые'],['In Progress','В работе'],['Done','Готово']];return `<div class="toolbar"><button class="btn primary" onclick="openCreateTask()">+ Задача</button><button class="btn" onclick="showOverdue()">Просроченные</button></div><div class="task-grid">${cols.map(([s,label])=>`<div class="task-col"><h3><span>${label}</span><span class="badge">${state.tasks.filter(t=>t.status===s).length}</span></h3>${state.tasks.filter(t=>t.status===s).map(taskCard).join('')||'<div class="empty">Пусто</div>'}</div>`).join('')}</div>`}
function taskCard(t){const o=employee(t.ownerId),d=t.dealId&&deal(t.dealId),p=t.projectId&&project(t.projectId);const overdue=t.status!=='Done'&&t.due<0;return `<div class="task"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(o?.name||'—')} · ${t.priority} · due ${t.due>=0?`Day +${t.due}`:'просрочено'}</div><div style="margin-top:7px">${overdue?'<span class="badge red">OVERDUE</span> ':''}${d?`<span class="badge blue">${esc(d.name)}</span> `:''}${p?`<span class="badge purple">${esc(p.name)}</span>`:''}</div><div class="actions" style="margin-top:7px">${t.status!=='Done'?`<button class="btn success" onclick="completeTask('${t.id}')">Готово</button>`:'<span class="badge green">✓ done</span>'}<button class="btn" onclick="openTask('${t.id}')">Открыть</button></div></div>`}

function renderFinance(){recalcFinance(state,false);const payroll=state.finance.payroll;const margin=state.finance.revenue?Math.round(state.finance.profit/state.finance.revenue*100):0;return `<div class="finance-grid">${metric('Cash',money(state.finance.cash))}${metric('Revenue',money(state.finance.revenue))}${metric('COGS',money(state.finance.costOfSales))}${metric('OpEx',money(state.finance.operatingExpenses))}${metric('Profit',money(state.finance.profit))}${metric('Margin',margin+'%')}${metric('Payroll',money(payroll))}${metric('Receivables',money(state.finance.receivables))}</div><div class="section-title">Financial structure</div><div class="grid split"><div class="card"><div class="grid" style="gap:8px">${[['Revenue',state.finance.revenue],['COGS',-state.finance.costOfSales],['Payroll',-payroll],['Other Opex',-(state.finance.operatingExpenses-payroll)],['Profit',state.finance.profit]].map(x=>`<div style="display:flex;justify-content:space-between;font-size:11px"><span>${x[0]}</span><b class="${x[1]<0?'danger-text':'good-text'}">${money(x[1])}</b></div>`).join('')}</div></div><div class="card"><div class="section-title" style="margin:0 0 8px">Budget pressures</div>${budgetPressure()}</div></div>`}
function metric(a,b){return `<div class="metric"><span>${a}</span><b>${b}</b></div>`}
function budgetPressure(){const payroll=state.finance.payroll;const cashCoverage=payroll?state.finance.cash/(payroll):0;return `<div class="notice">Текущий payroll: <b>${money(payroll)}</b> / месяц</div><div style="height:7px"></div><div class="notice">Cash coverage payroll: <b>${cashCoverage.toFixed(1)}×</b></div><div style="height:7px"></div><div class="notice">Receivables: <b>${money(state.finance.receivables)}</b></div>`}

function renderHR(){const active=activeEmployees().length;return `<div class="grid stats">${stat('Active',active,'из 36 в штате')}${stat('Managers',state.employees.filter(e=>e.type==='manager').length,'руководителей')}${stat('Directors',state.employees.filter(e=>e.type==='director').length,'директоров')}${stat('Open candidates',state.candidates.filter(c=>c.status!=='Hired').length,'pipeline')}${stat('Avg KPI',avg(activeEmployees().map(e=>e.kpi))+'%','team')}${stat('Avg motivation',avg(activeEmployees().map(e=>e.motivation))+'%','team')}${stat('Payroll',moneyShort(state.finance.payroll)+' ₸','monthly')}</div><div class="section-title">Candidates</div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Candidate</th><th>Role</th><th>Score</th><th>Experience</th><th>Salary</th><th>Status</th><th></th></tr></thead><tbody>${state.candidates.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.role)}</td><td>${c.score}</td><td>${c.experience}y</td><td>${moneyShort(c.salary)} ₸</td><td><span class="badge ${c.status==='Hired'?'green':'yellow'}">${c.status}</span></td><td><div class="row-actions"> <button class="btn" onclick="openCandidate('${c.id}')">Резюме</button>${c.status!=='Hired'?`<button class="btn success" onclick="hireCandidate('${c.id}')">Нанять</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></div>`}

function renderStrategy(){return `<div class="card"><div class="section-title" style="margin:0 0 7px">Company OKR / KPIs</div><p class="small muted">Цели не существуют отдельно от симуляции: сделки, проекты, HR и финансы постепенно двигают их вверх или вниз.</p>${state.goals.map(g=>{const pctVal=Math.min(100,Math.round(g.value/g.target*100));const owner=employee(g.ownerId);return `<div class="goal"><div><b style="font-size:11px">${esc(g.title)}</b><div class="small muted">Owner: ${esc(owner?.name||'—')}</div></div><div><div class="progress"><span style="width:${pctVal}%"></span></div><div class="small muted" style="margin-top:3px">${g.unit==='₸'?moneyShort(g.value)+' / '+moneyShort(g.target)+' ₸':g.value+' / '+g.target+g.unit}</div></div><b>${pctVal}%</b></div>`}).join('')}</div><div class="grid split" style="margin-top:12px"><div class="card"><div class="section-title" style="margin:0 0 8px">Culture signals</div>${cultureSignals()}</div><div class="card"><div class="section-title" style="margin:0 0 8px">CEO operating mode</div><div class="notice">Решения CEO напрямую меняют мотивацию, бюджет, workload и память сотрудников. Компания сохраняет причинно-следственную историю.</div></div></div>`}
function cultureSignals(){const values=[['Execution',avg(activeEmployees().map(e=>e.kpi))],['Trust',avg(activeEmployees().map(e=>e.loyalty))],['Energy',avg(activeEmployees().map(e=>e.energy))],['Workload pressure',avg(activeEmployees().map(e=>e.workload))]];return values.map(x=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:10px"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="progress" style="margin-top:4px"><span style="width:${x[1]}%"></span></div></div>`).join('')}

function renderDecisions(){const pending=state.decisions.filter(d=>d.status==='pending');const resolved=state.decisions.filter(d=>d.status!=='pending').slice(0,10);return `<div class="decision-list">${pending.map(d=>decisionCard(d,true)).join('')||'<div class="empty">Нет решений, ожидающих CEO.</div>'}</div><div class="section-title">История</div><div class="decision-list">${resolved.map(d=>decisionCard(d,false)).join('')||'<div class="empty">Пока нет закрытых решений.</div>'}</div>`}
function decisionCard(d,pending){return `<div class="decision"><div class="decision-head"><div><h3>${esc(d.title)}</h3><div class="small muted">Источник: ${esc(d.source)} · риск: ${esc(d.risk)}</div></div><span class="badge ${pending?'yellow':'green'}">${pending?'Ждёт CEO':'Закрыто'}</span></div><p>${esc(d.summary)}</p>${pending?`<div class="actions">${d.options.map(o=>`<button class="btn ${o[0]==='approve'?'primary':o[0]==='hold'?'':'warn'}" onclick="resolveDecision('${d.id}','${o[0]}')">${o[1]}</button>`).join('')}</div>`:`<div class="small muted">Решение принято: ${esc(d.resolution||'—')}</div>`}</div>`}

function renderObserver(){const cats=['all','decision','crm','project','hr','client','employee','system'];return `<div class="toolbar">${cats.map(c=>`<button class="btn ${observerFilter===c?'primary':''}" onclick="observerFilter='${c}';renderPage()">${c==='all'?'Все':c}</button>`).join('')}<button class="btn" onclick="clearEvents()">Очистить ленту</button></div><div class="card"><div class="feed">${state.events.filter(e=>observerFilter==='all'||e.category===observerFilter).map(eventHTML).join('')||'<div class="empty">Событий пока нет.</div>'}</div></div>`}
let observerFilter='all';
function clearEvents(){state.events=[];save();renderPage()}

function renderMessenger(){const c=state.chats.find(x=>x.id===selectedChat)||state.chats[0];return `<div class="messenger"><div class="chat-list"><div class="chat-list-head">Разговоры · ${state.chats.length}</div>${state.chats.slice().sort((a,b)=>b.updated-a.updated).map(ch=>`<div class="chat-item ${ch.id===c.id?'active':''}" onclick="chatDraft='';selectedChat='${ch.id}';renderPage()"><strong>${esc(ch.name)}</strong><p>${esc(ch.last||'Нет сообщений')}</p></div>`).join('')}</div><div class="chat-window"><div class="chat-head"><div class="avatar small">${c.type==='group'?'👥':initials(employee(c.participants.find(x=>x!=='ceo'))?.name||'Команда')}</div><div><b>${esc(c.name)}</b><span>${c.type==='group'?c.participants.length+' участников':'Личный разговор'} · можно вмешаться прямо сейчас</span></div></div><div id="messages" class="messages">${c.messages.map(messageHTML).join('')}</div><div class="chat-input"><input id="chatText" value="${escAttr(chatDraft)}" placeholder="Напишите сообщение…" oninput="chatDraft=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"><button class="btn primary" onclick="sendChat()">Отправить</button></div></div><div class="chat-context">${chatContext(c)}</div></div>`}
function messageHTML(m){const me=m.author==='ceo';const author=me?'Олег Ким':(employee(m.author)?.name||m.author);return `<div class="msg ${me?'mine':''}"><div class="msg-author">${esc(author)}</div><div class="bubble">${esc(m.text)}</div><div class="msg-time">Day ${m.day} · ${m.time}</div></div>`}
function chatContext(c){const participants=c.participants.map(employee).filter(Boolean);const pending=state.decisions.filter(d=>d.source.includes('Sales')&&c.participants.includes('d1'));const importantDeals=state.deals.filter(d=>c.participants.includes(d.ownerId)||c.participants.includes('d1')).slice(0,4);return `<div class="context-title">Контекст разговора</div><div class="context-block"><div class="context-label">Участники</div><div class="context-value">${participants.map(e=>e.name).join(', ')}</div></div><div class="context-block"><div class="context-label">Релевантные сделки</div><div class="context-value">${importantDeals.length?importantDeals.map(d=>d.name+' · '+d.prob+'%').join('<br>'):'Нет'}</div></div><div class="context-block"><div class="context-label">Решения</div><div class="context-value">${pending.length?pending.map(d=>d.title).join('<br>'):'Нет актуальных'}</div></div><div class="context-block"><div class="context-label">Правило</div><div class="context-value">Сотрудники отвечают с учётом роли, текущего состояния, памяти и предыдущих сообщений.</div></div>`}

function renderSettings(){return `<div class="grid split"><div class="card"><div class="section-title" style="margin:0">Управление симуляцией</div><p class="small muted">Все изменения сохраняются автоматически в localStorage этого браузера.</p><div class="actions"><button class="btn ${state.company.running?'warn':'success'}" onclick="state.company.running?stopTimer():startTimer()">${state.company.running?'Пауза':'Запустить'} симуляцию</button><button class="btn" onclick="advanceDayManual()">Следующий день</button></div><div class="section-title">Скорость</div><div class="actions"><button class="btn ${speed===1?'primary':''}" onclick="setSpeed(1)">×1</button><button class="btn ${speed===2?'primary':''}" onclick="setSpeed(2)">×2</button><button class="btn ${speed===5?'primary':''}" onclick="setSpeed(5)">×5</button></div></div><div class="card"><div class="section-title" style="margin:0">Данные и безопасность</div><div class="notice">Current state: <b>36 employees · 10 departments · 10 clients · 8 deals · 5 projects · 20 tasks</b></div><div class="small muted" style="margin-top:8px">Последнее сохранение: ${new Date(state.settings.lastSaved||Date.now()).toLocaleTimeString('ru-RU')}</div><div class="actions" style="margin-top:10px"><button class="btn" onclick="exportState()">Экспорт JSON</button><button class="btn danger" onclick="resetCompany()">Сбросить компанию</button></div></div></div>`}

function refreshChatMessages(){const c=state.chats.find(x=>x.id===selectedChat);const box=document.getElementById('messages');if(!c||!box)return;box.innerHTML=c.messages.map(messageHTML).join('');box.scrollTop=box.scrollHeight}
function sendChat(){const input=document.getElementById('chatText');if(!input)return;const text=input.value.trim();if(!text)return;const c=state.chats.find(x=>x.id===selectedChat);if(!c)return;chatDraft='';input.value='';pushMessage(c.id,'ceo',text,'ceo');const reactions=generateChatResponses(c,text);save();refreshChatMessages();requestAnimationFrame(()=>{const i=document.getElementById('chatText');if(i){i.focus();i.value=''}});reactions.forEach((r,i)=>setTimeout(()=>{pushMessage(c.id,r.author,r.text,'employee');const e=employee(r.author);if(e)remember(e,'CEO написал в чате: '+text.slice(0,120));save();if(currentPage==='messenger'){const active=document.activeElement; if(active&&active.id==='chatText') refreshChatMessages(); else renderPage()}},450*(i+1)))}
function startChat(id){let c=state.chats.find(x=>x.id==='chat_'+id)||state.chats.find(x=>x.type==='private'&&x.participants.includes(id)&&x.participants.includes('ceo'));if(!c){const e=employee(id);if(!e)return;c={id:'chat_'+id,name:e.name,type:'private',participants:['ceo',id],topic:e.role,last:'',updated:state.company.day,messages:[]};state.chats.push(c);pushMessageState(state,c.id,id,'Олег, привет. Я на связи. Если есть вопрос — можем обсудить здесь.','employee');save()}selectedChat=c.id;go('messenger')}
function generateChatResponses(c,text){
  const out=[];const lower=text.toLowerCase().trim();const participants=c.participants.filter(x=>x!=='ceo').map(employee).filter(Boolean);if(!participants.length)return out;
  const pick=participants[0];
  const add=(e,msg)=>{if(e)out.push({author:e.id,text:msg})};
  if(/жен|жена|вчера.*встреч|встреч.*вчера/.test(lower)){
    const d=participants.find(e=>(e.personal||'').toLowerCase().includes('жен'))||pick;
    add(d,'Да, всё нормально 🙂 Вчера спокойно посидели вместе, без рабочих разговоров. Я немного выдохнул, а сегодня уже полностью в рабочем режиме.');
    if(c.type==='group'&&participants[1])add(participants[1],`Хорошо, что удалось отключиться от работы. Кстати, по текущему вопросу я тоже посмотрю сегодня.`);
    return out;
  }
  if(/как дела|как ты|как сам|что нового/.test(lower)){
    add(pick,`Нормально. Сейчас у меня нагрузка ${Math.round(pick.workload)}%, KPI ${Math.round(pick.kpi)}%. ${pick.personal||'Держу текущие задачи под контролем.'}`);return out;
  }
  if(/nova|novatech/.test(lower)){
    const d=participants.find(e=>e.id==='d1')||pick;add(d,d.id==='d1'?'По NovaTech всё упирается в последнюю скидку. Они готовы двигаться, но я не хочу отдавать маржу без причины. Я сегодня дожму их до конкретного решения.':'Я посмотрю текущий статус NovaTech и вернусь уже с конкретикой.');return out;
  }
  if(/orion/.test(lower)){const d=participants.find(e=>e.id==='d2')||pick;add(d,'По Orion главный вопрос — scope интеграции. Я бы не обещал ускорение, пока не зафиксируем первую версию и ответственность команды.');return out;}
  if(/что происходит|что случилось|ситуац|проблем/.test(lower)){
    const related=state.events[0];add(pick,`Сейчас главное — ${related?related.text.toLowerCase():'держать текущие приоритеты под контролем'}. Я вижу это как рабочий вопрос, а не как критическую проблему.`);return out;
  }
  const roleText={director:'Понял тебя. Я свяжу это с текущими приоритетами функции, проверю ограничения и дам тебе конкретный вариант решения.',manager:'Принял. Я посмотрю, что происходит у команды, и вернусь не с общим ответом, а с конкретными действиями.',employee:'Понял. Я проверю факты по своей задаче и отвечу тебе по сути, а не просто скажу «разберусь».',ceo:'Принял.'};
  add(pick,roleText[pick.type]||roleText.employee);
  if(c.type==='group'&&participants.length>1){add(participants[1],pick.type==='director'?'Я тоже подключусь. Здесь есть связь с нашей текущей нагрузкой, поэтому лучше сразу посмотреть на решение с двух сторон.':'Я тоже посмотрю со своей стороны, чтобы мы не упустили зависимость.');}
  return out;
}

function openEmployee(id){const e=employee(id);if(!e)return;const dir=e.managerId&&employee(e.managerId);const rel=Object.entries(e.relationships||{}).map(([rid,v])=>`${employee(rid)?.name||rid}: ${v}%`).join('<br>')||'—';openModal(e.name,`<div class="profile"><div class="profile-side"><div class="avatar" style="margin:auto;width:70px;height:70px;font-size:20px">${initials(e.name)}</div><div class="center" style="margin-top:9px"><b>${esc(e.role)}</b><div class="small muted">${esc(department(e.department)?.name||e.department)}</div></div><div style="margin-top:13px" class="grid"><div class="meta"><span>KPI</span><b>${e.kpi}%</b></div><div class="meta"><span>Motivation</span><b>${e.motivation}%</b></div><div class="meta"><span>Workload</span><b>${e.workload}%</b></div><div class="meta"><span>Salary</span><b>${money(e.salary)}</b></div></div></div><div class="profile-main"><div class="card"><div class="kv"><span>Manager</span><b>${dir?esc(dir.name):'CEO'}</b></div><div class="kv"><span>Authority</span><b>${e.authority}%</b></div><div class="kv"><span>Skills</span><b>${e.skills.join(', ')}</b></div><div class="kv"><span>Responsibilities</span><b>${e.responsibilities.join('; ')}</b></div><div class="kv"><span>Personality</span><b>${esc(e.personality)}</b></div><div class="kv"><span>Personal</span><b>${esc(e.personal)}</b></div></div><div class="card"><div class="section-title" style="margin:0 0 8px">Relationships</div><div class="small">${rel}</div></div><div class="card"><div class="section-title" style="margin:0 0 8px">Memory</div><div class="timeline">${e.memory.slice(0,8).map(m=>`<div class="timeline-item">Day ${m.day} · ${m.time}<br>${esc(m.text)}</div>`).join('')}</div></div><div class="actions"><button class="btn primary" onclick="startChat('${e.id}');closeModal()">Открыть чат</button><button class="btn" onclick="openEmployeeEdit('${e.id}')">Изменить условия</button><button class="btn warn" onclick="trainEmployee('${e.id}')">Обучить</button>${e.type!=='ceo'?`<button class="btn danger" onclick="fireEmployee('${e.id}')">Уволить</button>`:''}</div></div></div>`)}
function openEmployeeEdit(id){const e=employee(id);openModal('Управление: '+e.name,`<div class="field-grid"><div class="field"><label>Salary</label><input id="editSalary" type="number" value="${e.salary}"></div><div class="field"><label>Bonus %</label><input id="editBonus" type="number" value="${e.bonus}"></div><div class="field"><label>KPI</label><input id="editKpi" type="number" min="0" max="100" value="${e.kpi}"></div><div class="field"><label>Workload</label><input id="editWorkload" type="number" min="0" max="100" value="${e.workload}"></div><div class="field"><label>Department</label><select id="editDept">${state.departments.map(d=>`<option value="${d.id}" ${d.id===e.department?'selected':''}>${d.name}</option>`).join('')}</select></div><div class="field"><label>Manager</label><select id="editManager"><option value="ceo">CEO</option>${state.employees.filter(x=>x.id!==e.id&&(x.type==='director'||x.type==='manager')).map(x=>`<option value="${x.id}" ${x.id===e.managerId?'selected':''}>${x.name} · ${x.role}</option>`).join('')}</select></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveEmployeeEdit('${id}')">Сохранить</button></div>`) }
function saveEmployeeEdit(id){const e=employee(id);const oldSalary=e.salary;e.salary=Number(document.getElementById('editSalary').value)||e.salary;e.bonus=Number(document.getElementById('editBonus').value)||e.bonus;e.kpi=Math.max(0,Math.min(100,Number(document.getElementById('editKpi').value)||e.kpi));e.workload=Math.max(0,Math.min(100,Number(document.getElementById('editWorkload').value)||e.workload));e.department=document.getElementById('editDept').value;e.managerId=document.getElementById('editManager').value;if(e.salary!==oldSalary)remember(e,'CEO изменил мою зарплату с '+money(oldSalary)+' на '+money(e.salary));addEvent('👤','CEO изменил условия сотрудника',`${e.name}: salary ${money(e.salary)}, KPI ${e.kpi}%, workload ${e.workload}%`,'employee','CEO');recalcFinance(state);save();closeModal();renderPage()}
function trainEmployee(id){const e=employee(id);if(!e)return;e.kpi=Math.min(100,e.kpi+3);e.motivation=Math.min(100,e.motivation+4);e.workload=Math.min(100,e.workload+5);remember(e,'CEO назначил обучение: KPI +3, мотивация +4.');addEvent('🎓','Training assigned',`${e.name} прошёл управленческое обучение.`,'employee','CEO');recalcFinance(state);save();closeModal();renderPage();toast(e.name+' получил обучение','good')}
function fireEmployee(id){const e=employee(id);if(!e||e.id==='ceo')return;if(!confirm('Уволить '+e.name+'?'))return;const fallback=e.managerId&&employee(e.managerId)?.status==='active'?e.managerId:'ceo';const dept=department(e.department);const directReports=state.employees.filter(x=>x.status==='active'&&x.managerId===id&&x.id!==id);e.status='terminated';state.tasks.filter(t=>t.ownerId===id&&t.status!=='Done').forEach(t=>{t.ownerId=fallback});state.deals.filter(d=>d.ownerId===id&&!['Won','Lost'].includes(d.stage)).forEach(d=>{d.ownerId=fallback==='ceo'?'d1':fallback;d.prob=Math.max(5,d.prob-7);d.history.push({day:state.company.day,text:'Владелец сменён после увольнения.'})});if(e.type==='manager'){directReports.forEach(x=>{x.managerId=fallback});if(dept&&dept.managerId===id){const replacementManager=state.employees.find(x=>x.status==='active'&&x.id!==id&&x.department===e.department&&x.type==='manager');dept.managerId=replacementManager?.id||fallback}}else if(e.type==='director'){state.departments.filter(d=>d.directorId===id).forEach(d=>{d.directorId='ceo'});directReports.forEach(x=>{x.managerId=fallback})}else{directReports.forEach(x=>{x.managerId=fallback})}state.company.reputation=Math.max(0,state.company.reputation-1);addEvent('🚪','Employee left',`${e.name} уволен. Открытые задачи, сделки и управленческие связи перераспределены.`,'hr','CEO','warn');activeEmployees().filter(x=>x.id!==e.id).forEach(x=>{if(x.relationships?.[id])x.motivation=Math.max(0,x.motivation-1)});recalcFinance(state);save();closeModal();renderPage();toast('Сотрудник уволен','warn')}
function openCreateEmployee(){openModal('Новый сотрудник',`<div class="field-grid"><div class="field"><label>Имя</label><input id="newName"></div><div class="field"><label>Роль</label><input id="newRole"></div><div class="field"><label>Отдел</label><select id="newDept">${state.departments.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}</select></div><div class="field"><label>Salary</label><input id="newSalary" type="number" value="380000"></div></div><div class="modal-actions"><button class="btn primary" onclick="createEmployee()">Принять</button></div>`) }
function createEmployee(){const name=document.getElementById('newName').value.trim();const role=document.getElementById('newRole').value.trim()||'Specialist';const dept=document.getElementById('newDept').value;const salary=Number(document.getElementById('newSalary').value)||380000;if(!name)return toast('Укажите имя','danger');const m=department(dept)?.managerId||department(dept)?.directorId||'ceo';const id='hire_'+state.company.nextId++;const e=makeEmployee(id,name,role,dept,m,'employee',{salary,kpi:68,motivation:82,loyalty:65,authority:15,personal:'Новый сотрудник только начинает формировать личную историю в компании.'});state.employees.push(e);addEvent('🧑‍💼','New employee joined',`${name} принят в ${department(dept)?.name||dept}.`,'hr','CEO');recalcFinance(state);save();closeModal();renderPage()}

function openCreateDeal(){openModal('Новая сделка',`<div class="field-grid"><div class="field"><label>Название</label><input id="newDealName"></div><div class="field"><label>Клиент</label><select id="newDealClient">${state.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label>Owner</label><select id="newDealOwner">${activeEmployees().filter(e=>e.type==='employee'||e.type==='manager').map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select></div><div class="field"><label>Value</label><input id="newDealValue" type="number" value="5000000"></div><div class="field"><label>Stage</label><select id="newDealStage">${stages.slice(0,5).map(s=>`<option value="${s}">${stageNames[s]}</option>`).join('')}</select></div><div class="field"><label>Probability</label><input id="newDealProb" type="number" min="5" max="95" value="35"></div></div><div class="modal-actions"><button class="btn primary" onclick="createDeal()">Создать</button></div>`) }
function createDeal(){const name=document.getElementById('newDealName').value.trim()||'Новая сделка';const d={id:'deal'+state.company.nextId++,name,clientId:document.getElementById('newDealClient').value,ownerId:document.getElementById('newDealOwner').value,value:Number(document.getElementById('newDealValue').value)||5000000,stage:document.getElementById('newDealStage').value,prob:Number(document.getElementById('newDealProb').value)||35,margin:(Number(document.getElementById('newDealValue').value)||5000000)*.35,next:'Определить следующий шаг',createdDay:state.company.day,lastActionDay:state.company.day,history:[{day:state.company.day,text:'Создана CEO.'}]};state.deals.push(d);const o=employee(d.ownerId);if(o){o.workload=Math.min(100,o.workload+6);remember(o,'CEO назначил новую сделку: '+d.name)}addEvent('⌁','New CRM deal',`${d.name} добавлена в pipeline на ${money(d.value)}.`,'crm','CEO');recalcFinance(state);save();closeModal();renderPage()}
function openDeal(id){const d=deal(id),c=client(d.clientId),o=employee(d.ownerId);openModal(d.name,`<div class="grid split2"><div class="card"><div class="kv"><span>Client</span><b>${esc(c?.name||'—')}</b></div><div class="kv"><span>Owner</span><b>${esc(o?.name||'—')}</b></div><div class="kv"><span>Stage</span><b>${stageNames[d.stage]}</b></div><div class="kv"><span>Value</span><b>${money(d.value)}</b></div><div class="kv"><span>Probability</span><b>${d.prob}%</b></div><div class="kv"><span>Margin</span><b>${money(d.margin)}</b></div><div class="kv"><span>Next action</span><b>${esc(d.next)}</b></div></div><div class="card"><div class="section-title" style="margin:0 0 8px">CRM history</div><div class="timeline">${d.history.slice().reverse().map(h=>`<div class="timeline-item">Day ${h.day}<br>${esc(h.text)}</div>`).join('')}</div></div></div><div class="actions" style="margin-top:12px">${d.stage!=='Won'?`<button class="btn success" onclick="advanceDeal('${id}')">Двинуть дальше</button>`:''}<button class="btn warn" onclick="openDealEdit('${id}')">Изменить</button>${d.stage!=='Lost'&&d.stage!=='Won'?`<button class="btn danger" onclick="loseDeal('${id}')">Потерять</button>`:''}</div>`) }
function advanceDeal(id){const d=deal(id),i=stages.indexOf(d.stage);if(!d||i<0||i>=5)return;if(d.stage==='Negotiation'&&d.prob>=70){d.stage='Won';state.finance.cash+=d.value*.45;state.finance.receivables+=d.value*.92;const c=client(d.clientId);if(c)c.health=Math.min(100,c.health+6);addEvent('✅','Deal won',`${d.name} закрыта на ${money(d.value)}.`,'crm',employee(d.ownerId)?.name||'Sales','good')}else{d.stage=stages[i+1];d.prob=Math.min(95,d.prob+8);d.history.push({day:state.company.day,text:'Стадия изменена CEO → '+stageNames[d.stage]});addEvent('🎯','CRM stage advanced',`${d.name}: ${stageNames[d.stage]}, probability ${d.prob}%.`,'crm','CEO')}recalcFinance(state);save();closeModal();renderPage()}
function loseDeal(id){const d=deal(id);if(!d||['Won','Lost'].includes(d.stage))return;d.stage='Lost';d.prob=0;d.history.push({day:state.company.day,text:'Сделка потеряна по решению CEO.'});const c=client(d.clientId);if(c)c.health=Math.max(0,c.health-7);state.company.reputation=Math.max(0,state.company.reputation-1);addEvent('✕','Deal lost',`${d.name} потеряна.`,'crm','CEO','warn');recalcFinance(state);save();closeModal();renderPage()}
function openDealEdit(id){const d=deal(id);openModal('Изменить сделку',`<div class="field-grid"><div class="field"><label>Stage</label><select id="dealStageEdit">${stages.map(s=>`<option value="${s}" ${d.stage===s?'selected':''}>${stageNames[s]}</option>`).join('')}</select></div><div class="field"><label>Probability</label><input id="dealProbEdit" type="number" value="${d.prob}"></div><div class="field"><label>Next action</label><input id="dealNextEdit" value="${esc(d.next)}"></div><div class="field"><label>Value</label><input id="dealValueEdit" type="number" value="${d.value}"></div></div><div class="modal-actions"><button class="btn primary" onclick="saveDealEdit('${id}')">Сохранить</button></div>`) }
function saveDealEdit(id){const d=deal(id),old=d.stage,newStage=document.getElementById('dealStageEdit').value;if(!d)return;if((old==='Won'||old==='Lost')&&newStage!==old)return toast('Закрытую сделку нельзя переводить обратно через редактирование','warn');d.stage=newStage;d.prob=Math.max(0,Math.min(100,Number(document.getElementById('dealProbEdit').value)||d.prob));d.next=document.getElementById('dealNextEdit').value.trim()||d.next;const oldMarginRate=d.value?d.margin/d.value:.38;d.value=Number(document.getElementById('dealValueEdit').value)||d.value;d.margin=Math.max(0,d.value*oldMarginRate);if(old!==d.stage){d.history.push({day:state.company.day,text:'CEO изменил стадию: '+stageNames[d.stage]});if(d.stage==='Won'){state.finance.cash+=d.value*.45;state.finance.receivables+=d.value*.92;const c=client(d.clientId);if(c)c.health=Math.min(100,c.health+6);addEvent('✅','Deal won',`${d.name} закрыта через редактирование CRM.`,'crm','CEO','good')}if(d.stage==='Lost'){const c=client(d.clientId);if(c)c.health=Math.max(0,c.health-7);state.company.reputation=Math.max(0,state.company.reputation-1);addEvent('✕','Deal lost',`${d.name} переведена в Lost через редактирование CRM.`,'crm','CEO','warn')}}addEvent('⌁','CRM updated',`${d.name}: ${stageNames[d.stage]} · ${d.prob}%`,'crm','CEO');recalcFinance(state);save();closeModal();renderPage()}
function openCRMAnalytics(){const top=state.deals.slice().sort((a,b)=>b.value-a.value);openModal('CRM Analytics',`<div class="grid triple">${metric('Pipeline',money(state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).reduce((a,d)=>a+d.value,0)))}${metric('Weighted',money(state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).reduce((a,d)=>a+d.value*d.prob/100,0)))}${metric('Win rate',calcWinRate()+'%')}</div><div class="section-title">Top deals</div><div class="table-wrap"><table class="table"><tr><th>Deal</th><th>Value</th><th>Prob</th><th>Owner</th></tr>${top.map(d=>`<tr><td>${esc(d.name)}</td><td>${money(d.value)}</td><td>${d.prob}%</td><td>${esc(employee(d.ownerId)?.name||'—')}</td></tr>`).join('')}</table></div>`) }

function openProject(id){const p=project(id),m=employee(p.managerId),c=p.clientId&&client(p.clientId);openModal(p.name,`<div class="grid split2"><div class="card"><div class="kv"><span>Client</span><b>${c?esc(c.name):'Internal'}</b></div><div class="kv"><span>Manager</span><b>${esc(m?.name||'—')}</b></div><div class="kv"><span>Progress</span><b>${p.progress}%</b></div><div class="kv"><span>Budget</span><b>${money(p.budget)}</b></div><div class="kv"><span>Risk</span><b>${p.risk}%</b></div><div class="kv"><span>Deadline</span><b>Day ${p.deadline}</b></div></div><div class="card"><div class="section-title" style="margin:0 0 8px">Related tasks</div><div class="timeline">${state.tasks.filter(t=>t.projectId===p.id).map(t=>`<div class="timeline-item">${esc(t.title)} · ${esc(employee(t.ownerId)?.name||'—')} · ${t.status}</div>`).join('')||'<div class="empty">Нет задач</div>'}</div></div></div><div class="actions" style="margin-top:12px"><button class="btn success" onclick="advanceProject('${id}')">+ Progress</button><button class="btn warn" onclick="projectRiskAction('${id}')">Риск</button></div>`) }

function openProjectAnalytics(){const risk=avg(state.projects.map(p=>p.risk));const prog=avg(state.projects.map(p=>p.progress));openModal('Project Portfolio',`<div class="grid triple">${metric('Average progress',prog+'%')}${metric('Average risk',risk+'%')}${metric('Budget',money(state.projects.reduce((a,p)=>a+p.budget,0)))}</div><div class="section-title">Delivery map</div>${state.projects.map(p=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:10px"><span>${esc(p.name)}</span><b>${p.progress}%</b></div><div class="progress"><span style="width:${p.progress}%"></span></div></div>`).join('')}`)}

function openTask(id){const t=task(id),e=employee(t.ownerId);openModal(t.title,`<div class="grid split2"><div class="card"><div class="kv"><span>Owner</span><b>${esc(e?.name||'—')}</b></div><div class="kv"><span>Status</span><b>${t.status}</b></div><div class="kv"><span>Priority</span><b>${t.priority}</b></div><div class="kv"><span>Due</span><b>${t.due<0?'Просрочено':'Day +'+t.due}</b></div><div class="kv"><span>Deal</span><b>${t.dealId?esc(deal(t.dealId)?.name||'—'):'—'}</b></div><div class="kv"><span>Project</span><b>${t.projectId?esc(project(t.projectId)?.name||'—'):'—'}</b></div></div><div class="card"><div class="notice">Задача влияет на workload владельца, KPI и сроки связанных сделок/проектов.</div></div></div><div class="actions" style="margin-top:12px">${t.status!=='Done'?`<button class="btn success" onclick="completeTask('${id}')">Выполнить</button>`:''}<button class="btn danger" onclick="deleteTask('${id}')">Удалить</button></div>`) }
function completeTask(id){const t=task(id);if(!t||t.status==='Done')return;t.status='Done';const e=employee(t.ownerId);if(e){e.workload=Math.max(0,e.workload-8);e.kpi=Math.min(100,e.kpi+2);e.motivation=Math.min(100,e.motivation+1);remember(e,'Я завершил задачу: '+t.title)}if(t.dealId){const d=deal(t.dealId);if(d&&!['Won','Lost'].includes(d.stage)){d.prob=Math.min(95,d.prob+5);d.history.push({day:state.company.day,text:'Связанная задача завершена; вероятность +5 п.п.'})}}if(t.projectId){const p=project(t.projectId);if(p&&p.status!=='Done'){p.progress=Math.min(100,p.progress+3);p.risk=Math.max(0,p.risk-1);if(p.progress>=100)p.status='Done'}}addEvent('✓','Task completed',`${e?.name||'Employee'} завершил: ${t.title}.`,'employee',e?.name||'System','good');recalcFinance(state);save();closeModal();renderPage()}
function deleteTask(id){const t=task(id);state.tasks=state.tasks.filter(x=>x.id!==id);addEvent('🗑','Task deleted',`${t?.title||'Task'} удалена CEO.`,'employee','CEO','warn');recalcFinance(state);save();closeModal();renderPage()}
function openCreateTask(){openModal('Новая задача',`<div class="field-grid"><div class="field"><label>Title</label><input id="newTaskTitle"></div><div class="field"><label>Owner</label><select id="newTaskOwner">${activeEmployees().filter(e=>e.type!=='ceo').map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select id="newTaskPriority"><option>Normal</option><option>High</option></select></div><div class="field"><label>Due in days</label><input id="newTaskDue" type="number" value="3"></div></div><div class="modal-actions"><button class="btn primary" onclick="createTask()">Создать</button></div>`) }
function createTask(){const title=document.getElementById('newTaskTitle').value.trim()||'CEO task';const ownerId=document.getElementById('newTaskOwner').value;const e=employee(ownerId);if(!e)return toast('Не найден владелец задачи','danger');const t={id:'t'+state.company.nextId++,title,ownerId,dealId:null,projectId:null,priority:document.getElementById('newTaskPriority').value,status:'Open',due:Number(document.getElementById('newTaskDue').value)||3,createdDay:state.company.day};state.tasks.push(t);e.workload=Math.min(100,e.workload+7);remember(e,'CEO назначил мне задачу: '+title);addEvent('☑','CEO assigned task',`${title} → ${e.name}`,'employee','CEO');recalcFinance(state);save();closeModal();renderPage()}
function showOverdue(){const ids=state.tasks.filter(t=>t.status!=='Done'&&t.due<0).map(t=>t.id);if(!ids.length)return toast('Просроченных задач нет','good');openModal('Просроченные задачи',ids.map(id=>{const t=task(id);return `<div class="notice" style="margin-bottom:6px"><b>${esc(t.title)}</b><div class="small muted">${esc(employee(t.ownerId)?.name||'—')} · ${-t.due} дн. просрочки</div></div>`}).join(''))}

function openCandidate(id){const c=state.candidates.find(x=>x.id===id);openModal(c.name,`<div class="card"><div class="kv"><span>Role</span><b>${esc(c.role)}</b></div><div class="kv"><span>Score</span><b>${c.score}/100</b></div><div class="kv"><span>Experience</span><b>${c.experience} years</b></div><div class="kv"><span>Salary</span><b>${money(c.salary)}</b></div><div class="kv"><span>Skills</span><b>${c.skills.join(', ')}</b></div></div><div class="section-title">Recruiter notes</div><div class="notice">${esc(c.notes)}</div><div class="actions" style="margin-top:12px">${c.status!=='Hired'?`<button class="btn success" onclick="hireCandidate('${id}')">Нанять</button>`:''}</div>`)}
function hireCandidate(id){const c=state.candidates.find(x=>x.id===id);if(!c||c.status==='Hired')return;const dept=c.role.includes('Account')?'sales':c.role.includes('Product')?'product':c.role.includes('Customer')?'customer_success':c.role.includes('Marketing')?'marketing':'bizdev';const isDirector=/Director|CTO|CFO|COO/i.test(c.role);const isManager=!isDirector&&(/Head|Manager|Lead/i.test(c.role));const type=isDirector?'director':isManager?'manager':'employee';const manager=isDirector?'ceo':(department(dept)?.managerId||department(dept)?.directorId||'ceo');const e=makeEmployee('hire'+state.company.nextId++,c.name,c.role,dept,manager,type,{salary:c.salary,kpi:c.score,motivation:88,loyalty:58,authority:isDirector?82:isManager?55:20,skills:c.skills,responsibilities:isDirector?['Стратегия функции','Кросс-функциональное управление','KPI функции']:isManager?['Планирование команды','Контроль KPI','Результат отдела']:['Освоить роль','Выполнить первые KPI'],personal:c.notes,memory:[{day:state.company.day,time:timeLabel(),text:'Нанят CEO из кадрового pipeline.'}]});state.employees.push(e);if(isDirector){const d=department(dept);if(d)d.directorId=e.id}else if(isManager){const d=department(dept);if(d)d.managerId=e.id}c.status='Hired';addEvent('♙','Candidate hired',`${c.name} принят в ${department(dept)?.name||dept} как ${isDirector?'директор':isManager?'руководитель':'сотрудник'}.`,'hr','CEO','good');recalcFinance(state);save();closeModal();renderPage();toast(c.name+' принят','good')}

function resolveDecision(id,choice){const d=state.decisions.find(x=>x.id===id);if(!d||d.status!=='pending')return;const opt=d.options.find(x=>x[0]===choice);d.status='resolved';d.resolution=opt?opt[1]:'Решено';if(id==='dec1'){const dealX=deal('deal1');const pctDisc=opt?opt[3]:0;dealX.prob=Math.min(95,dealX.prob+(pctDisc?7:0));dealX.margin=Math.max(0,dealX.margin-dealX.value*pctDisc/100);if(pctDisc)remember(employee('d1'),'CEO согласовал скидку '+pctDisc+'% для NovaTech.')}if(id==='dec2'){const p=project('p2');if(opt&&opt[3]){p.progress=Math.min(100,p.progress+4);p.risk=Math.min(100,p.risk+8);employee('m3').workload=Math.min(100,employee('m3').workload+12)}else{p.risk=Math.max(0,p.risk-3)}}if(id==='dec3'&&opt&&opt[3]){addEvent('♙','Hiring request opened','CEO открыл вакансию Senior Account Manager.','hr','CEO');state.candidates.push({id:'cand'+state.company.nextId++,name:'Виктор Савин',role:'Senior Account Manager',score:82,experience:6,skills:['B2B','KAM','Negotiation'],salary:410000,status:'Screening',notes:'Кандидат добавлен автоматически по решению HR.'})}if(d.options.some(o=>o[0]==='deal_review')&&opt&&opt[3]){const target=state.deals.find(x=>d.title.includes(x.name));if(target){target.prob=Math.min(95,target.prob+12);target.history.push({day:state.company.day,text:'CEO инициировал review; вероятность +12 п.п.'})}}if(d.options.some(o=>o[0]==='project_resource')&&opt&&opt[3]){const target=state.projects.find(x=>d.title.includes(x.name));if(target){target.risk=Math.max(0,target.risk-15);const m=employee(target.managerId);if(m)m.workload=Math.max(0,m.workload-6)}}if(d.options.some(o=>o[0]==='cash')&&opt&&opt[3]){state.finance.operatingExpenses=Math.max(0,state.finance.operatingExpenses-500000);state.finance.cash+=1000000}state.employees.filter(e=>e.type==='director').forEach(e=>remember(e,'CEO принял решение: '+d.resolution));addEvent('⚖','CEO decision',`${d.title}: ${d.resolution}.`,'decision','CEO','good');recalcFinance(state);save();renderPage();toast('Решение применено','good')}

function recalcFinance(s,emit=true){const payroll=s.employees.filter(e=>e.status==='active'&&e.type!=='ceo').reduce((a,e)=>a+e.salary,0);const revenueWon=s.deals.filter(d=>d.stage==='Won').reduce((a,d)=>a+d.value*.92,0);const pipelineBooked=s.deals.filter(d=>!['Lost'].includes(d.stage)).reduce((a,d)=>a+(d.stage==='Won'?0:d.value*d.prob*.12/100),0);s.finance.payroll=payroll;s.finance.revenue=Math.max(32000000+revenueWon,pipelineBooked+20000000);s.finance.costOfSales=Math.round(s.finance.revenue*.32);const projectRun=s.projects.reduce((a,p)=>a+p.budget*.015,0);s.finance.operatingExpenses=Math.round(payroll+projectRun+2200000+s.finance.bonusAccrued*.05);s.finance.profit=s.finance.revenue-s.finance.costOfSales-s.finance.operatingExpenses;s.finance.burn=Math.max(0,s.finance.operatingExpenses-s.finance.revenue/2);s.finance.receivables=Math.max(0,6800000+s.deals.filter(d=>d.stage==='Won').reduce((a,d)=>a+d.value*.4,0)-s.company.day*10000);s.company.revenue=s.finance.revenue;s.company.profit=s.finance.profit;s.company.cash=s.finance.cash;updateGoals(s);if(emit)updateHealth(s)}
function updateGoals(s){const g=x=>s.goals.find(y=>y.id===x);if(!g('g1'))return;g('g1').value=s.finance.revenue;g('g2').value=calcWinRate(s);g('g3').value=s.projects.length?Math.round(s.projects.filter(p=>p.status==='Done'||p.risk<25).length/s.projects.length*100):0;g('g4').value=s.finance.revenue?Math.round(s.finance.profit/s.finance.revenue*100):0;g('g5').value=Math.min(100,Math.round(s.employees.filter(e=>e.status==='active').length/36*100));g('g6').value=avg(s.clients.map(c=>c.health))}
function updateHealth(s){const k=avg(activeEmployees().filter(e=>e.type!=='ceo').map(e=>e.kpi));const m=avg(activeEmployees().filter(e=>e.type!=='ceo').map(e=>e.motivation));const risk=s.projects.filter(p=>p.risk>30).length;const overdue=s.tasks.filter(t=>t.status!=='Done'&&t.due<0).length;const clientH=avg(s.clients.map(c=>c.health));s.company.health=Math.max(0,Math.min(100,Math.round(k*.27+m*.25+clientH*.2+Math.max(0,100-risk*10)*.14+Math.max(0,100-overdue*8)*.14))) }

function tickHour(){advanceClock(60);processPeople();processTasksEngine();processDealsEngine();processProjectsEngine();processClients();processDirectors();recalcFinance(state);state.finance.cash=Math.max(0,state.finance.cash-state.finance.operatingExpenses/720);state.company.cash=state.finance.cash;save();}
function advanceClock(minutes){state.company.minute+=minutes;while(state.company.minute>=60){state.company.minute-=60;state.company.hour++;}if(state.company.hour>=24){state.company.hour=0;state.company.day++;dayBoundary()}}
function dayBoundary(){state.tasks.forEach(t=>{if(t.status!=='Done')t.due--;});state.employees.forEach(e=>{if(e.type!=='ceo')e.energy=Math.min(100,e.energy+20);});addEvent('🌅','New company day','Компания начала новый игровой день.','system','System');}
function advanceDayManual(){for(let i=0;i<24;i++)tickHour();go('dashboard');}
function processPeople(){activeEmployees().filter(e=>e.type!=='ceo').forEach(e=>{const oldM=e.motivation; if(e.workload>85){e.motivation=Math.max(25,e.motivation-1);e.energy=Math.max(20,e.energy-2);e.kpi=Math.max(40,e.kpi-(e.workload>95?1:0))}else if(e.workload<60&&e.kpi>80){e.motivation=Math.min(100,e.motivation+0.3)}else if(e.energy<35){e.motivation=Math.max(35,e.motivation-.2)}e.workload=Math.max(15,e.workload-(e.status==='active'?1:0));if(Math.abs(oldM-e.motivation)>=2)addEvent('◌','Employee state changed',`${e.name}: motivation ${Math.round(e.motivation)}%, workload ${Math.round(e.workload)}%.`,'employee',e.name,e.motivation<50?'warn':'info')})}
function processTasksEngine(){state.tasks.filter(t=>t.status!=='Done').forEach(t=>{const e=employee(t.ownerId);if(!e)return;const pressure=t.priority==='High'?2:1;if(e.workload<95){if(t.status==='Open'&&((state.company.day+t.title.length)%4===0))t.status='In Progress';if(t.status==='In Progress'&&((state.company.hour+t.title.length)%7===0)){completeTaskInternal(t.id)}}e.workload=Math.min(100,e.workload+(t.status==='Open'?0.4:pressure*.15));if(t.due<0&&t.status!=='Done'&&t.due%2===0)addEvent('⚠','Task overdue',`${t.title} · owner ${e.name}.`,'employee',e.name,'warn')})}
function completeTaskInternal(id){const t=task(id);if(!t||t.status==='Done')return;t.status='Done';const e=employee(t.ownerId);if(e){e.workload=Math.max(0,e.workload-5);e.kpi=Math.min(100,e.kpi+1)}if(t.dealId){const d=deal(t.dealId);if(d&&!['Won','Lost'].includes(d.stage)){d.prob=Math.min(95,d.prob+3);d.history.push({day:state.company.day,text:'Связанная задача автоматически завершена.'})}}addEvent('✓','Employee completed task',`${e?.name||'Employee'} завершил ${t.title}.`,'employee',e?.name||'System','good')}
function processDealsEngine(){state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).forEach(d=>{const o=employee(d.ownerId);const c=client(d.clientId);if(!o||!c)return;const manager=employee(o.managerId);const base=o.kpi>85?1:.3;const loadPenalty=o.workload>85?1.7:0;if(d.stage==='Lead'&&d.prob>25&&state.company.day%3===0){d.stage='Contacted';d.prob+=5;d.history.push({day:state.company.day,text:'Лид квалифицирован.'});addEvent('⌁','CRM progression',`${d.name} перешла в Contacted.`,'crm',o.name,'good')}else if(d.stage==='Contacted'&&d.prob>35&&state.company.hour%5===0){d.stage='Discovery';d.prob=Math.min(90,d.prob+3);d.history.push({day:state.company.day,text:'Discovery назначен.'})}else if(d.stage==='Discovery'&&d.prob>42&&state.company.day%4===0){d.stage='Proposal';d.prob=Math.min(92,d.prob+2);d.history.push({day:state.company.day,text:'Proposal подготовлен.'})}else if(d.stage==='Proposal'&&d.prob>55&&state.company.day%5===0){d.stage='Negotiation';d.prob=Math.min(95,d.prob+3);d.history.push({day:state.company.day,text:'Начались переговоры.'})}else if(d.stage==='Negotiation'&&d.prob>78&&o.workload<88&&c.health>70&&state.company.day%6===0){d.stage='Won';d.prob=100;c.health=Math.min(100,c.health+5);state.finance.revenue+=d.value;state.finance.cash+=d.value*.45;addEvent('✅','Deal won',`${d.name} закрыта без вмешательства CEO.`,'crm',o.name,'good')}else{d.prob=Math.max(5,Math.min(95,d.prob+Math.round(base*.6-loadPenalty*.5)));if(c.health<60)d.prob=Math.max(5,d.prob-2)}})}
function processProjectsEngine(){state.projects.filter(p=>p.status!=='Done').forEach(p=>{const m=employee(p.managerId);if(!m)return;let delta=.6+(m.kpi/100);if(m.workload>88)delta-=.8;if(p.risk>40)delta-=.5;p.progress=Math.min(100,p.progress+Math.max(0,delta));if(p.progress>=100){p.status='Done';p.risk=0;addEvent('▣','Project completed',`${p.name} завершён системой.`,'project',m.name,'good')}else if(p.risk>45&&state.company.day%3===0)addEvent('⚠','Project risk',`${p.name}: risk ${p.risk}%, менеджеру нужен ресурс.`,'project',m.name,'warn')})}
function processClients(){state.clients.forEach(c=>{const deals=state.deals.filter(d=>d.clientId===c.id&&!['Lost'].includes(d.stage));const open=deals.some(d=>!['Won','Lost'].includes(d.stage));const projectCount=state.projects.filter(p=>p.clientId===c.id&&p.status!=='Done').length;const cs=state.employees.filter(e=>e.department==='customer_success');const avgLoad=cs.length?avg(cs.map(e=>e.workload)):50;if(open)c.health=Math.max(40,Math.min(100,c.health+(avgLoad<80?.15:-.35)));if(projectCount&&avg(state.projects.filter(p=>p.clientId===c.id).map(p=>p.risk))>35)c.health=Math.max(30,c.health-.4);if(c.health<55&&state.company.day%2===0){const owner=cs[0];if(owner)addEvent('♥','Client health alert',`${c.name} health ${Math.round(c.health)}%. Требуется intervention.`,'client',owner.name,'warn')}})}
function processDirectors(){const sales=employee('d1'),cto=employee('d2'),cfo=employee('d3'),hr=employee('d4'),coo=employee('d5');const hot=state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).sort((a,b)=>a.prob-b.prob)[0];if(hot&&hot.prob<30&&!state.decisions.some(d=>d.status==='pending'&&d.title.includes(hot.name))){state.decisions.push({id:'dec'+state.company.nextId++,title:`${hot.name} в зоне риска`,source:'Sales Director',risk:'revenue',status:'pending',summary:`Вероятность сделки упала до ${hot.prob}%. Sales Director предлагает вмешательство.`,options:[['approve','Назначить CEO review','deal_review',1],['hold','Пока наблюдать','deal_review',0]]});addEvent('⚖','Director proposed decision',`Александр Волков поднял вопрос по ${hot.name}.`,'decision','Александр Волков','warn');remember(sales,'Я поднял для CEO риск по сделке '+hot.name)}const highRisk=state.projects.find(p=>p.risk>45);if(highRisk&&!state.decisions.some(d=>d.status==='pending'&&d.title.includes(highRisk.name))){state.decisions.push({id:'dec'+state.company.nextId++,title:`Ресурс для ${highRisk.name}`,source:'CTO',risk:'delivery',status:'pending',summary:`Проект ${highRisk.name} имеет риск ${highRisk.risk}%. CTO предлагает временно усилить команду.`,options:[['approve','Дать ресурс','project_resource',1],['hold','Не менять состав','project_resource',0]]});addEvent('⚖','CTO proposed decision',`Мария Соколова запросила ресурс на ${highRisk.name}.`,'decision','Мария Соколова','warn');remember(cto,'Я подняла вопрос о ресурсе для '+highRisk.name)}if(avg(activeEmployees().filter(e=>e.department==='sales').map(e=>e.workload))>84&&!state.decisions.some(d=>d.status==='pending'&&d.source==='HR Director')){state.decisions.push({id:'dec'+state.company.nextId++,title:'Sales team перегружен',source:'HR Director',risk:'capacity',status:'pending',summary:'Средняя нагрузка Sales превысила 84%. Нужен кадровый ответ.',options:[['approve','Открыть вакансию','hire_request',1],['hold','Перераспределить задачи','hire_request',0]]});addEvent('⚖','HR proposed decision','Елена Морозова зафиксировала перегрузку Sales.','decision','Елена Морозова','warn');remember(hr,'Я подготовила CEO кадровое решение по Sales')}if(state.finance.cash<25000000&&!state.decisions.some(d=>d.status==='pending'&&d.source==='CFO')){state.decisions.push({id:'dec'+state.company.nextId++,title:'Cash buffer снизился',source:'CFO',risk:'cash',status:'pending',summary:'CFO предлагает замедлить необязательные расходы.',options:[['approve','Заморозить часть Opex','cash',1],['hold','Продолжить план','cash',0]]});addEvent('⚖','CFO proposed decision','Дмитрий Орлов поднял вопрос по cash buffer.','decision','Дмитрий Орлов','warn');remember(cfo,'Я поднял вопрос о cash buffer для CEO')}const overdue=state.tasks.filter(t=>t.status!=='Done'&&t.due<0).length;if(overdue>4){coo.workload=Math.min(100,coo.workload+2);if(state.company.day%2===0)addEvent('◉','COO monitoring operations',`Просроченные задачи: ${overdue}. COO начинает перераспределение.`,'employee',coo.name,'warn')}}

(function () {

      s.aiEnabled && s.aiEndpoint

  async function askAIInternal({
    mode,
    employeeId,
    message,
    chatId
  }) {
    const endpoint =
      String(
        state.settings.aiEndpoint || ''
      ).replace(/\/$/, '');

    if (
      !endpoint ||
      !state.settings.aiEnabled
    ) {
      return null;
    }

    const e =
      employee(employeeId);

    if (!e) {
      throw new Error(
        'Сотрудник не найден'
      );
    }

    const chat =
      chatId
        ? state.chats.find(
            x => x.id === chatId
          )
        : null;

    const payload = {
      mode:
        mode || 'chat',

      message:
        String(message || '')
          .slice(0, 2200),

      employee: {
        id: e.id,
        name: e.name,
        role: e.role,
        type: e.type,
        department: e.department,

        manager:
          e.managerId
            ? employee(
                e.managerId
              )?.name
            : 'CEO',

        kpi: e.kpi,
        motivation: e.motivation,
        workload: e.workload,
        energy: e.energy,

        authority:
          e.authority,

        skills:
          e.skills,

        personality:
          e.personality,

        personal:
          e.personal,

        memory:
          e.memory.slice(0, 12),

        responsibilities:
          e.responsibilities
      },

      company:
        buildCompanyContext(
          e,
          chat
        ),

      context: {
        chat:
          chat
            ? recentChatMessages(
                chat
              )
            : []
      }
    };

    const response =
      await fetch(
        endpoint,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );

    let data;

    try {
      data =
        await response.json();
    } catch {
      throw new Error(
        'Worker вернул некорректный ответ'
      );
    }

    if (
      !response.ok ||
      data?.ok === false
    ) {
      throw new Error(
        data?.error ||
        `Worker: HTTP ${response.status}`
      );
    }

    return data;
  }
