  function applyAIAction(
    action,
    actorId,
    originChatId
  ) {

    if (
      !action ||
      typeof action !== 'object'
    ) {
      return;
    }

    const actor =
      employee(actorId);

    if (
      action.type ===
      'remember'
    ) {

      const target =
        employee(
          action.employeeId
        ) || actor;

      if (
        target &&
        action.text
      ) {

        remember(
          target,
          String(
            action.text
          ).slice(0, 500)
        );
      }

      return;
    }

    if (
      action.type ===
      'send_message'
    ) {

      const chat =
        state.chats.find(
          x =>
            x.id ===
            action.chatId
        ) ||
        state.chats.find(
          x =>
            x.id ===
            originChatId
        );

      if (
        chat &&
        action.text
      ) {

        pushMessage(
          chat.id,
          actorId,
          String(
            action.text
          ).slice(0, 1200),
          'employee'
        );
      }

      return;
    }

    if (
      action.type ===
      'create_task'
    ) {

      const owner =
        employee(
          action.ownerId
        ) || actor;

      if (
        !owner ||
        actor?.type ===
          'employee'
      ) {
        return;
      }

      const task =
        {
          id:
            'ai_task_' +
            state.company.nextId++,

          title:
            String(
              action.title ||
              'Задача от ИИ'
            ).slice(0, 160),

          ownerId:
            owner.id,

          dealId:
            action.dealId ||
            null,

          projectId:
            action.projectId ||
            null,

          priority:
            action.priority ===
            'High'
              ? 'High'
              : 'Normal',

          status:
            'Open',

          due:
            Math.max(
              1,
              Number(
                action.dueDays
              ) || 1
            ),

          createdDay:
            state.company.day
        };

      state.tasks.push(
        task
      );

      owner.workload =
        Math.min(
          100,
          owner.workload + 6
        );

      remember(
        owner,
        'Мне назначили задачу: ' +
        task.title
      );

      addEvent(
        '🤖',
        'ИИ создал задачу',
        `${actor.name}: ${task.title}`,
        'employee',
        actor.name,
        'info'
      );

      return;
    }

    if (
      action.type ===
      'update_deal'
    ) {

      const d =
        deal(
          action.dealId
        );

      if (
        !d ||
        !actor
      ) {
        return;
      }

      if (
        ![
          'director',
          'manager'
        ].includes(
          actor.type
        ) &&
        d.ownerId !==
          actor.id
      ) {
        return;
      }

      if (
        stages.includes(
          action.stage
        )
      ) {
        d.stage =
          action.stage;
      }

      const probability =
        Number(
          action.prob
        );

      if (
        Number.isFinite(
          probability
        )
      ) {

        d.prob =
          Math.max(
            0,
            Math.min(
              100,
              probability
            )
          );
      }

      d.history.push({
        day:
          state.company.day,

        text:
          `ИИ ${actor.name} обновил сделку: ${
            stageNames[d.stage]
          } · ${d.prob}%`
      });

      addEvent(
        '⌁',
        'ИИ обновил CRM',
        `${actor.name}: ${d.name} → ${stageNames[d.stage]}, ${d.prob}%`,
        'crm',
        actor.name,
        'info'
      );

      return;
    }

    if (
      action.type ===
      'create_decision'
    ) {

      if (
        !actor ||
        actor.type !==
          'director'
      ) {
        return;
      }

      const title =
        String(
          action.title ||
          'Решение директора'
        );

      const duplicate =
        state.decisions.some(
          d =>
            d.status ===
              'pending' &&
            d.title ===
              title
        );

      if (duplicate) {
        return;
      }

      state.decisions.unshift({
        id:
          'ai_decision_' +
          state.company.nextId++,

        title:
          title.slice(0, 180),

        source:
          actor.name,

        summary:
          String(
            action.summary ||
            'AI-директор предлагает управленческое решение.'
          ).slice(0, 700),

        options:
          Array.isArray(
            action.options
          ) &&
          action.options.length
            ? action.options
            : [
                [
                  'approve',
                  'Одобрить',
                  0
                ],
                [
                  'hold',
                  'Отложить',
                  0
                ]
              ],

        status:
          'pending'
      });

      addEvent(
        '⚖',
        'ИИ предложил решение',
        `${actor.name}: ${title}`,
        'decision',
        actor.name,
        'warn'
      );

      return;
    }

    if (
      action.type ===
      'create_event'
    ) {

      addEvent(
        '🤖',
        String(
          action.title ||
          'Событие ИИ'
        ).slice(0, 120),

        String(
          action.text ||
          ''
        ).slice(0, 500),

        action.category ||
          'system',

        actor?.name ||
          'ИИ',

        action.severity ||
          'info'
      );
    }
  }

  sendChat =
    window.sendChat =
      async function () {

        const input =
          document.getElementById(
            'chatText'
          );

        if (!input) {
          return;
        }

        const text =
          input.value.trim();

        if (!text) {
          return;
        }

        const chat =
          state.chats.find(
            x =>
              x.id ===
              selectedChat
          );

        if (!chat) {
          return;
        }

        chatDraft = '';
        input.value = '';

        pushMessage(
          chat.id,
          'ceo',
          text,
          'ceo'
        );

        save();
        refreshChatMessages();

        requestAnimationFrame(
          () =>
            document
              .getElementById(
                'chatText'
              )
              ?.focus()
        );

        const primaryId =
          chat.participants.find(
            id =>
              id !==
              'ceo'
          );

        const primary =
          primaryId
            ? employee(primaryId)
            : null;

        if (!primary) {
          return;
        }

        if (
          state.settings.aiEnabled &&
          state.settings.aiEndpoint
        ) {

          toast(
            primary.name +
            ' формирует ответ…'
          );

          try {

            const result =
              await askAIInternal({
                mode: 'chat',
                employeeId:
                  primary.id,
                message:
                  text,
                chatId:
                  chat.id
              });

            if (
              result?.reply
            ) {

              pushMessage(
                chat.id,
                primary.id,
                String(
                  result.reply
                ).slice(
                  0,
                  1600
                ),
                'employee'
              );

              remember(
                primary,
                'Олег спросил: ' +
                text.slice(
                  0,
                  100
                ) +
                ' Ответ: ' +
                String(
                  result.reply
                ).slice(
                  0,
                  140
                )
              );
            }

            if (
              Array.isArray(
                result?.actions
              )
            ) {

              result.actions
                .slice(0, 4)
                .forEach(
                  action =>
                    applyAIAction(
                      action,
                      primary.id,
                      chat.id
                    )
                );
            }

            save();
            refreshChatMessages();

            requestAnimationFrame(
              () =>
                document
                  .getElementById(
                    'chatText'
                  )
                  ?.focus()
            );

          } catch (error) {

            toast(
              'ИИ недоступен: ' +
              error.message,
              'warn'
            );

            const fallback =
              generateChatResponses(
                chat,
                text
              );

            fallback.forEach(
              (r, i) => {

                setTimeout(
                  () => {

                    pushMessage(
                      chat.id,
                      r.author,
                      r.text,
                      'employee'
                    );

                    const e =
                      employee(
                        r.author
                      );

                    if (e) {
                      remember(
                        e,
                        'CEO написал: ' +
                        text.slice(
                          0,
                          100
                        )
                      );
                    }

                    save();
                    refreshChatMessages();
                  },
                  450 *
                    (i + 1)
                );
              }
            );
          }

          return;
        }

        const reactions =
          generateChatResponses(
            chat,
            text
          );

        reactions.forEach(
          (r, i) => {

            setTimeout(
              () => {

                pushMessage(
                  chat.id,
                  r.author,
                  r.text,
                  'employee'
                );

                const e =
                  employee(
                    r.author
                  );

                if (e) {
                  remember(
                    e,
                    'CEO написал: ' +
                    text.slice(
                      0,
                      100
                    )
                  );
                }

                save();
                refreshChatMessages();

              },
              450 *
                (i + 1)
            );
          }
        );
      };

  window.runAutonomousAI =
    async function () {

      if (
        !state.settings.aiEnabled ||
        !state.settings.aiAutonomy ||
        !state.settings.aiEndpoint
      ) {
        return;
      }

      const directors =
        activeEmployees().filter(
          e =>
            e.type ===
            'director'
        );

      for (
        const director of directors
      ) {

        try {

          const result =
            await askAIInternal({
              mode: 'agent',

              employeeId:
                director.id,

              chatId:
                'board',

              message:
                'Проанализируй текущее состояние компании. Действуй только в пределах своей роли. Не создавай активность без причины. Если нужно действие — предложи максимум 3 конкретных действия.'
            });

          if (
            Array.isArray(
              result?.actions
            )
          ) {

            result.actions
              .slice(0, 4)
              .forEach(
                action =>
                  applyAIAction(
                    action,
                    director.id,
                    'board'
                  )
              );
          }

          if (
            result?.reply &&
            result?.actions?.length
          ) {

            pushMessage(
              'board',
              director.id,
              String(
                result.reply
              ).slice(
                0,
                1200
              ),
              'employee'
            );
          }

          remember(
            director,
            'Автономный AI-анализ: ' +
            String(
              result?.reply ||
              'Новых действий нет.'
            ).slice(
              0,
              180
            )
          );

        } catch (error) {

          addEvent(
            '⚠',
            'Ошибка AI-директора',
            `${director.name}: ${error.message}`,
            'system',
            director.name,
            'warn'
          );
        }
      }

      save();

      if (
        currentPage ===
          'messenger' ||
        currentPage ===
          'dashboard' ||
        currentPage ===
          'observer' ||
        currentPage ===
          'decisions'
      ) {
        renderPage();
      }
    };

  let aiLastHourKey = '';

  setInterval(
    () => {

      if (
        !state.company.running ||
        !state.settings.aiEnabled ||
        !state.settings.aiAutonomy ||
        !state.settings.aiEndpoint
      ) {

    },
