<script>
/* Alatau Nexus — AI + Messenger Hotfix */
(function(){
  'use strict';

  const DEFAULT_AI = {
    aiEndpoint: '',
    aiModel: 'gpt-5.6-luna',
    aiEnabled: false,
    aiAutonomy: false
  };

  function ensureAISettings(){
    state.settings = Object.assign({}, DEFAULT_AI, state.settings || {});
    save();
  }

  ensureAISettings();

  function aiSettingsCard(){
    const s = state.settings;
    const status = s.aiEnabled && s.aiEndpoint ? 'ИИ включён' : 'ИИ не подключён';
    return `<div class="card">
      <div class="section-title" style="margin:0">ИИ сотрудников</div>
      <div class="notice"><b>${status}</b><br><span class="small muted">ИИ работает через защищённый Cloudflare Worker. API-ключ хранится только в Worker и не попадает в GitHub.</span></div>
      <div class="field" style="margin-top:10px">
        <label>Адрес AI Worker</label>
        <input id="aiEndpoint" value="${esc(s.aiEndpoint)}" placeholder="https://ваш-worker.workers.dev">
      </div>
      <div class="field" style="margin-top:8px">
        <label>Модель</label>
        <input id="aiModel" value="${esc(s.aiModel)}" placeholder="gpt-5.6-luna">
      </div>
      <label style="display:flex;gap:7px;align-items:center;margin-top:10px;font-size:10px;color:#a7b9cf">
        <input type="checkbox" id="aiAutonomy" ${s.aiAutonomy?'checked':''}>
        Директора могут самостоятельно работать через ИИ
      </label>
      <div class="actions" style="margin-top:10px">
        <button class="btn primary" onclick="saveAISettings()">Сохранить</button>
        <button class="btn success" onclick="toggleAI()">${s.aiEnabled?'Отключить ИИ':'Включить ИИ'}</button>
        <button class="btn" onclick="testAIConnection()">Проверить связь</button>
      </div>
    </div>`;
  }

  window.renderSettings = function(){
    return `<div class="grid split">
      <div class="card">
        <div class="section-title" style="margin:0">Управление симуляцией</div>
        <p class="small muted">Компания живёт по игровому времени. Изменения сохраняются автоматически в браузере.</p>
        <div class="actions">
          <button class="btn ${state.company.running?'warn':'success'}" onclick="state.company.running?stopTimer():startTimer()">${state.company.running?'Пауза':'Запустить'} симуляцию</button>
          <button class="btn" onclick="advanceDayManual()">Следующий день</button>
        </div>
        <div class="section-title">Скорость</div>
        <div class="actions">
          <button class="btn ${speed===1?'primary':''}" onclick="setSpeed(1)">×1</button>
          <button class="btn ${speed===2?'primary':''}" onclick="setSpeed(2)">×2</button>
          <button class="btn ${speed===5?'primary':''}" onclick="setSpeed(5)">×5</button>
        </div>
      </div>
      ${aiSettingsCard()}
    </div>
    <div class="grid split" style="margin-top:12px">
      <div class="card">
        <div class="section-title" style="margin:0">Данные и безопасность</div>
        <div class="notice">36 сотрудников · 10 отделов · 10 клиентов · 8 сделок · 5 проектов · 20 задач</div>
        <div class="small muted" style="margin-top:8px">Последнее сохранение: ${new Date(state.settings.lastSaved||Date.now()).toLocaleTimeString('ru-RU')}</div>
        <div class="actions" style="margin-top:10px">
          <button class="btn" onclick="exportState()">Экспорт JSON</button>
          <button class="btn danger" onclick="resetCompany()">Сбросить компанию</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin:0">Как работает ИИ</div>
        <div class="notice">У каждого AI-сотрудника есть должность, полномочия, характер, память, задачи и текущий контекст компании. В личном чате ИИ отвечает от лица выбранного сотрудника. В автономном режиме директора могут предлагать задачи, сообщения, изменения CRM и управленческие решения.</div>
      </div>
    </div>`;
  };

  window.saveAISettings = function(){
    const endpoint = document.getElementById('aiEndpoint');
    const model = document.getElementById('aiModel');
    const autonomy = document.getElementById('aiAutonomy');
    state.settings.aiEndpoint = (endpoint?.value || '').trim().replace(/\/$/, '');
    state.settings.aiModel = (model?.value || '').trim() || DEFAULT_AI.aiModel;
    state.settings.aiAutonomy = !!autonomy?.checked;
    save();
    toast('Настройки ИИ сохранены','good');
    renderPage();
  };

  window.toggleAI = function(){
    const endpoint = document.getElementById('aiEndpoint');
    const model = document.getElementById('aiModel');
    const autonomy = document.getElementById('aiAutonomy');
    state.settings.aiEndpoint = (endpoint?.value || state.settings.aiEndpoint || '').trim().replace(/\/$/, '');
    state.settings.aiModel = (model?.value || state.settings.aiModel || DEFAULT_AI.aiModel).trim();
    state.settings.aiAutonomy = !!autonomy?.checked;
    if(!state.settings.aiEnabled && !state.settings.aiEndpoint){
      save();
      toast('Сначала укажи адрес AI Worker','warn');
      return;
    }
    state.settings.aiEnabled = !state.settings.aiEnabled;
    save();
    renderPage();
    toast(state.settings.aiEnabled?'ИИ сотрудников включён':'ИИ сотрудников отключён', state.settings.aiEnabled?'good':'warn');
  };

  function recentChatMessages(chat, limit=12){
    return (chat?.messages || []).slice(-limit).map(m=>({
      author: m.author === 'ceo' ? 'Олег Ким' : (employee(m.author)?.name || m.author),
      text: String(m.text || ''),
      day: m.day,
      time: m.time
    }));
  }

  function buildCompanyContext(e, chat){
    return {
      day: state.company.day,
      time: timeLabel(),
      health: state.company.health,
      reputation: state.company.reputation,
      cash: state.finance.cash,
      revenue: state.finance.revenue,
      profit: state.finance.profit,
      employees: activeEmployees().map(x=>({id:x.id,name:x.name,role:x.role,type:x.type,department:x.department,kpi:x.kpi,motivation:x.motivation,workload:x.workload,energy:x.energy})),
      tasks: state.tasks.filter(t=>t.ownerId===e.id).slice(0,12),
      deals: state.deals.filter(d=>d.ownerId===e.id || e.type==='director').slice(0,10),
      projects: state.projects.filter(p=>p.managerId===e.id || e.type==='director').slice(0,8),
      events: state.events.slice(0,12),
      chat: chat ? {id:chat.id,name:chat.name,type:chat.type,participants:chat.participants.map(employee).filter(Boolean).map(x=>x.name),messages:recentChatMessages(chat)} : null
    };
  }

  async function askAIInternal({mode, employeeId, message, chatId}){
    const endpoint = String(state.settings.aiEndpoint || '').replace(/\/$/,'');
    if(!endpoint || !state.settings.aiEnabled) return null;
    const e = employee(employeeId);
    if(!e) throw new Error('Сотрудник не найден');
    const c = chatId ? state.chats.find(x=>x.id===chatId) : null;

    const payload = {
      mode: mode || 'chat',
      message: String(message || '').slice(0,2200),
      employee: {
        id:e.id,name:e.name,role:e.role,type:e.type,department:e.department,
        manager:e.managerId ? employee(e.managerId)?.name : 'CEO',
        kpi:e.kpi,motivation:e.motivation,workload:e.workload,energy:e.energy,
        authority:e.authority,skills:e.skills,personality:e.personality,
        personal:e.personal,memory:e.memory.slice(0,12),responsibilities:e.responsibilities
      },
      company: buildCompanyContext(e,c),
      context: {chat:c ? recentChatMessages(c) : []}
    };

    const res = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    let data;
    try { data = await res.json(); }
    catch { throw new Error('Worker вернул некорректный ответ'); }

    if(!res.ok || data?.ok===false) throw new Error(data?.error || `Worker: HTTP ${res.status}`);
    return data;
  }

  window.testAIConnection = async function(){
    saveAISettings();
    if(!state.settings.aiEndpoint){toast('Сначала укажи адрес AI Worker','warn');return;}
    const wasEnabled = state.settings.aiEnabled;
    state.settings.aiEnabled = true;
    try{
      const result = await askAIInternal({
        mode:'chat',
        employeeId:'d1',
        chatId:'chat_d1',
        message:'Поздоровайся с Олегом одной естественной фразой и скажи, что связь с ИИ работает.'
      });
      toast(result?.reply ? 'Связь с ИИ работает' : 'Worker отвечает без текста','good');
    }catch(e){
      state.settings.aiEnabled = wasEnabled;
      save();
      toast('Ошибка ИИ: '+e.message,'danger');
    }
  };

  function findPrivateChat(employeeId){
    return state.chats.find(c=>c.type==='private' && c.participants.includes('ceo') && c.participants.includes(employeeId));
  }

  function applyAIAction(action, actorId, originChatId){
    if(!action || typeof action !== 'object') return;
    const actor = employee(actorId);
    if(action.type==='remember'){
      const target = employee(action.employeeId) || actor;
      if(target && action.text) remember(target,String(action.text).slice(0,500));
      return;
    }
    if(action.type==='send_message'){
      const c = state.chats.find(x=>x.id===action.chatId) || state.chats.find(x=>x.id===originChatId);
      if(c && action.text) pushMessage(c.id,actorId,String(action.text).slice(0,1200),'employee');
      return;
    }
    if(action.type==='create_task'){
      const owner = employee(action.ownerId) || actor;
      if(!owner || actor?.type==='employee') return;
      const t={id:'ait'+state.company.nextId++,title:String(action.title||'Задача от AI').slice(0,160),ownerId:owner.id,dealId:action.dealId||null,projectId:action.projectId||null,priority:action.priority==='High'?'High':'Normal',status:'Open',due:Math.max(1,Number(action.dueDays)||1),createdDay:state.company.day};
      state.tasks.push(t); owner.workload=Math.min(100,owner.workload+6); remember(owner,'Мне назначили задачу: '+t.title); addEvent('🤖','ИИ создал задачу',`${actor.name}: ${t.title}`,'employee',actor.name,'info');
      return;
    }
    if(action.type==='update_deal'){
      const d=deal(action.dealId); if(!d||!actor) return;
      if(!['director','manager'].includes(actor.type) && d.ownerId!==actor.id) return;
      if(stages.includes(action.stage)) d.stage=action.stage;
      const p=Number(action.prob); if(Number.isFinite(p)) d.prob=Math.max(0,Math.min(100,p));
      d.history.push({day:state.company.day,text:`ИИ ${actor.name} обновил сделку: ${stageNames[d.stage]} · ${d.prob}%`});
      addEvent('⌁','ИИ обновил CRM',`${actor.name}: ${d.name} → ${stageNames[d.stage]}, ${d.prob}%`,'crm',actor.name,'info');
      return;
    }
    if(action.type==='create_decision'){
      if(!actor || actor.type!=='director') return;
      const exists=state.decisions.some(d=>d.status==='pending'&&d.title===String(action.title||''));
      if(exists) return;
      state.decisions.unshift({id:'ai_dec'+state.company.nextId++,title:String(action.title||'Решение директора').slice(0,180),source:actor.name,summary:String(action.summary||'AI-директор предлагает управленческое решение.').slice(0,700),options:Array.isArray(action.options)&&action.options.length?action.options:[['approve','Одобрить',0],['hold','Отложить',0]],status:'pending'});
      addEvent('⚖','ИИ предложил решение',`${actor.name}: ${action.title}`,'decision',actor.name,'warn');
    }
    if(action.type==='create_event'){
      addEvent('🤖',String(action.title||'Событие ИИ').slice(0,120),String(action.text||'').slice(0,500),action.category||'system',actor?.name||'AI',action.severity||'info');
    }
  }

  window.sendChat = async function(){
    const input=document.getElementById('chatText');
    if(!input) return;
    const text=input.value.trim();
    if(!text) return;
    const c=state.chats.find(x=>x.id===selectedChat);
    if(!c) return;

    chatDraft='';
    input.value='';
    pushMessage(c.id,'ceo',text,'ceo');
    save();
    refreshChatMessages();
    requestAnimationFrame(()=>document.getElementById('chatText')?.focus());

    const primaryId=c.participants.find(id=>id!=='ceo');
    const primary=primaryId ? employee(primaryId) : null;
    if(!primary) return;

    if(state.settings.aiEnabled && state.settings.aiEndpoint){
      toast(primary.name+' формирует ответ…');
      try{
        const result=await askAIInternal({mode:'chat',employeeId:primary.id,message:text,chatId:c.id});
        if(result?.reply){
          pushMessage(c.id,primary.id,String(result.reply).slice(0,1600),'employee');
          remember(primary,'Олег спросил: '+text.slice(0,100)+' Ответ: '+String(result.reply).slice(0,140));
        }
        if(Array.isArray(result?.actions)) result.actions.slice(0,4).forEach(a=>applyAIAction(a,primary.id,c.id));
        save();
        refreshChatMessages();
        requestAnimationFrame(()=>document.getElementById('chatText')?.focus());
      }catch(e){
        toast('ИИ недоступен: '+e.message,'warn');
        const reactions=generateChatResponses(c,text);
        if(reactions.length){
          reactions.forEach((r,i)=>setTimeout(()=>{pushMessage(c.id,r.author,r.text,'employee');const emp=employee(r.author);if(emp)remember(emp,'CEO написал: '+text.slice(0,100));save();refreshChatMessages()},450*(i+1)));
        }
      }
      return;
    }

    const reactions=generateChatResponses(c,text);
    reactions.forEach((r,i)=>setTimeout(()=>{
      pushMessage(c.id,r.author,r.text,'employee');
      const emp=employee(r.author);if(emp)remember(emp,'CEO написал: '+text.slice(0,100));
      save();refreshChatMessages();
    },450*(i+1)));
  };

  window.runAutonomousAI = async function(){
    if(!state.settings.aiEnabled || !state.settings.aiAutonomy || !state.settings.aiEndpoint) return;
    const directors=activeEmployees().filter(e=>e.type==='director');
    for(const d of directors){
      try{
        const result=await askAIInternal({mode:'agent',employeeId:d.id,chatId:'board',message:'Проанализируй текущее состояние компании. Действуй только в пределах своей роли. Не создавай активность без причины. Если нужно действие — предложи максимум 3 конкретных действия.'});
        if(Array.isArray(result?.actions)) result.actions.slice(0,4).forEach(a=>applyAIAction(a,d.id,'board'));
        if(result?.reply && result?.actions?.length) pushMessage('board',d.id,String(result.reply).slice(0,1200),'employee');
        remember(d,'Автономный AI-анализ: '+String(result?.reply||'Без новых действий').slice(0,180));
      }catch(e){
        addEvent('⚠','Ошибка AI-директора',`${d.name}: ${e.message}`,'system',d.name,'warn');
      }
    }
    save();
    if(currentPage==='messenger'||currentPage==='dashboard'||currentPage==='observer'||currentPage==='decisions') renderPage();
  };

  const originalTickHour = window.tickHour;
  let aiLastHourKey = '';
  window.tickHour = function(){
    originalTickHour();
    const key=state.company.day+'-'+state.company.hour;
    if(state.company.running && state.settings.aiEnabled && state.settings.aiAutonomy && state.company.hour%6===0 && key!==aiLastHourKey){
      aiLastHourKey=key;
      runAutonomousAI();
    }
  };

  // Полностью русифицируем оставшиеся названия, не трогая имена людей и данные CRM.
  window.translateRenderedUI = (function(original){
    return function(){
      if(typeof original==='function') original();
      const replacements={
        'Dashboard':'Панель управления','Company OS':'Система управления компанией','Founder & CEO':'Основатель и CEO',
        'Messenger':'Мессенджер','Observer':'Наблюдатель','Settings':'Система','Strategy':'Стратегия','Decisions':'Решения',
        'Current state':'Текущее состояние','Sales Director':'Директор по продажам','CTO':'CTO','CFO':'CFO','COO':'COO',
        'Manager':'Руководитель','Owner':'Владелец','Stage':'Этап','Probability':'Вероятность','Value':'Сумма',
        'Salary':'Зарплата','Bonus %':'Бонус %','Workload':'Нагрузка','Motivation':'Мотивация','Authority':'Полномочия',
        'Responsibilities':'Обязанности','Personality':'Характер','Personal':'Личное','Memory':'Память','Relationships':'Отношения',
        'Role':'Роль','Department':'Отдел','Client':'Клиент','Project':'Проект','Progress':'Прогресс','Risk':'Риск',
        'Status':'Статус','Priority':'Приоритет','Due':'Срок','Title':'Название','Name':'Имя','Score':'Оценка',
        'Experience':'Опыт','Skills':'Навыки','Send':'Отправить','Write a message':'Напишите сообщение','Internal':'Внутренний'
      };
      const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
      const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
      nodes.forEach(n=>{let t=n.nodeValue;Object.entries(replacements).forEach(([a,b])=>{t=t.replace(new RegExp('\\b'+a.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')+'\\b','g'),b)});n.nodeValue=t;});
    };
  })(window.translateRenderedUI);

  // Фикс: AI reply не перерисовывает страницу и не уничтожает поле ввода.
  const originalStartTimer = window.startTimer;
  window.startTimer = function(){
    originalStartTimer();
    if(currentPage==='messenger') refreshChatMessages();
  };

  // После первоначальной отрисовки добавляем AI-настройки в уже открытом состоянии.
  if(currentPage==='settings') renderPage();
})();

</script>

/* Alatau Nexus — AI + Messenger Hotfix */
(function(){
  'use strict';
  if(window.__alatauAIHotfixLoaded) return;
  window.__alatauAIHotfixLoaded=true;

  const DEFAULT_AI = {
    aiEndpoint: '',
    aiModel: 'gpt-5.6-luna',
    aiEnabled: false,
    aiAutonomy: false
  };

  function ensureAISettings(){
    state.settings = Object.assign({}, DEFAULT_AI, state.settings || {});
    save();
  }

  ensureAISettings();

  function aiSettingsCard(){
    const s = state.settings;
    const status = s.aiEnabled && s.aiEndpoint ? 'ИИ включён' : 'ИИ не подключён';
    return `<div class="card">
      <div class="section-title" style="margin:0">ИИ сотрудников</div>
      <div class="notice"><b>${status}</b><br><span class="small muted">ИИ работает через защищённый Cloudflare Worker. API-ключ хранится только в Worker и не попадает в GitHub.</span></div>
      <div class="field" style="margin-top:10px">
        <label>Адрес AI Worker</label>
        <input id="aiEndpoint" value="${esc(s.aiEndpoint)}" placeholder="https://ваш-worker.workers.dev">
      </div>
      <div class="field" style="margin-top:8px">
        <label>Модель</label>
        <input id="aiModel" value="${esc(s.aiModel)}" placeholder="gpt-5.6-luna">
      </div>
      <label style="display:flex;gap:7px;align-items:center;margin-top:10px;font-size:10px;color:#a7b9cf">
        <input type="checkbox" id="aiAutonomy" ${s.aiAutonomy?'checked':''}>
        Директора могут самостоятельно работать через ИИ
      </label>
      <div class="actions" style="margin-top:10px">
        <button class="btn primary" onclick="saveAISettings()">Сохранить</button>
        <button class="btn success" onclick="toggleAI()">${s.aiEnabled?'Отключить ИИ':'Включить ИИ'}</button>
        <button class="btn" onclick="testAIConnection()">Проверить связь</button>
      </div>
    </div>`;
  }

  renderSettings = window.renderSettings = function(){
    return `<div class="grid split">
      <div class="card">
        <div class="section-title" style="margin:0">Управление симуляцией</div>
        <p class="small muted">Компания живёт по игровому времени. Изменения сохраняются автоматически в браузере.</p>
        <div class="actions">
          <button class="btn ${state.company.running?'warn':'success'}" onclick="state.company.running?stopTimer():startTimer()">${state.company.running?'Пауза':'Запустить'} симуляцию</button>
          <button class="btn" onclick="advanceDayManual()">Следующий день</button>
        </div>
        <div class="section-title">Скорость</div>
        <div class="actions">
          <button class="btn ${speed===1?'primary':''}" onclick="setSpeed(1)">×1</button>
          <button class="btn ${speed===2?'primary':''}" onclick="setSpeed(2)">×2</button>
          <button class="btn ${speed===5?'primary':''}" onclick="setSpeed(5)">×5</button>
        </div>
      </div>
      ${aiSettingsCard()}
    </div>
    <div class="grid split" style="margin-top:12px">
      <div class="card">
        <div class="section-title" style="margin:0">Данные и безопасность</div>
        <div class="notice">36 сотрудников · 10 отделов · 10 клиентов · 8 сделок · 5 проектов · 20 задач</div>
        <div class="small muted" style="margin-top:8px">Последнее сохранение: ${new Date(state.settings.lastSaved||Date.now()).toLocaleTimeString('ru-RU')}</div>
        <div class="actions" style="margin-top:10px">
          <button class="btn" onclick="exportState()">Экспорт JSON</button>
          <button class="btn danger" onclick="resetCompany()">Сбросить компанию</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin:0">Как работает ИИ</div>
        <div class="notice">У каждого AI-сотрудника есть должность, полномочия, характер, память, задачи и текущий контекст компании. В личном чате ИИ отвечает от лица выбранного сотрудника. В автономном режиме директора могут предлагать задачи, сообщения, изменения CRM и управленческие решения.</div>
      </div>
    </div>`;
  };

  window.saveAISettings = function(){
    const endpoint = document.getElementById('aiEndpoint');
    const model = document.getElementById('aiModel');
    const autonomy = document.getElementById('aiAutonomy');
    state.settings.aiEndpoint = (endpoint?.value || '').trim().replace(/\/$/, '');
    state.settings.aiModel = (model?.value || '').trim() || DEFAULT_AI.aiModel;
    state.settings.aiAutonomy = !!autonomy?.checked;
    save();
    toast('Настройки ИИ сохранены','good');
    renderPage();
  };

  window.toggleAI = function(){
    const endpoint = document.getElementById('aiEndpoint');
    const model = document.getElementById('aiModel');
    const autonomy = document.getElementById('aiAutonomy');
    state.settings.aiEndpoint = (endpoint?.value || state.settings.aiEndpoint || '').trim().replace(/\/$/, '');
    state.settings.aiModel = (model?.value || state.settings.aiModel || DEFAULT_AI.aiModel).trim();
    state.settings.aiAutonomy = !!autonomy?.checked;
    if(!state.settings.aiEnabled && !state.settings.aiEndpoint){
      save();
      toast('Сначала укажи адрес AI Worker','warn');
      return;
    }
    state.settings.aiEnabled = !state.settings.aiEnabled;
    save();
    renderPage();
    toast(state.settings.aiEnabled?'ИИ сотрудников включён':'ИИ сотрудников отключён', state.settings.aiEnabled?'good':'warn');
  };

  function recentChatMessages(chat, limit=12){
    return (chat?.messages || []).slice(-limit).map(m=>({
      author: m.author === 'ceo' ? 'Олег Ким' : (employee(m.author)?.name || m.author),
      text: String(m.text || ''),
      day: m.day,
      time: m.time
    }));
  }

  function buildCompanyContext(e, chat){
    return {
      day: state.company.day,
      time: timeLabel(),
      health: state.company.health,
      reputation: state.company.reputation,
      cash: state.finance.cash,
      revenue: state.finance.revenue,
      profit: state.finance.profit,
      employees: activeEmployees().map(x=>({id:x.id,name:x.name,role:x.role,type:x.type,department:x.department,kpi:x.kpi,motivation:x.motivation,workload:x.workload,energy:x.energy})),
      tasks: state.tasks.filter(t=>t.ownerId===e.id).slice(0,12),
      deals: state.deals.filter(d=>d.ownerId===e.id || e.type==='director').slice(0,10),
      projects: state.projects.filter(p=>p.managerId===e.id || e.type==='director').slice(0,8),
      events: state.events.slice(0,12),
      chat: chat ? {id:chat.id,name:chat.name,type:chat.type,participants:chat.participants.map(employee).filter(Boolean).map(x=>x.name),messages:recentChatMessages(chat)} : null
    };
  }

  async function askAIInternal({mode, employeeId, message, chatId}){
    const endpoint = String(state.settings.aiEndpoint || '').replace(/\/$/,'');
    if(!endpoint || !state.settings.aiEnabled) return null;
    const e = employee(employeeId);
    if(!e) throw new Error('Сотрудник не найден');
    const c = chatId ? state.chats.find(x=>x.id===chatId) : null;

    const payload = {
      mode: mode || 'chat',
      message: String(message || '').slice(0,2200),
      employee: {
        id:e.id,name:e.name,role:e.role,type:e.type,department:e.department,
        manager:e.managerId ? employee(e.managerId)?.name : 'CEO',
        kpi:e.kpi,motivation:e.motivation,workload:e.workload,energy:e.energy,
        authority:e.authority,skills:e.skills,personality:e.personality,
        personal:e.personal,memory:e.memory.slice(0,12),responsibilities:e.responsibilities
      },
      company: buildCompanyContext(e,c),
      context: {chat:c ? recentChatMessages(c) : []}
    };

    const res = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    let data;
    try { data = await res.json(); }
    catch { throw new Error('Worker вернул некорректный ответ'); }

    if(!res.ok || data?.ok===false) throw new Error(data?.error || `Worker: HTTP ${res.status}`);
    return data;
  }

  window.testAIConnection = async function(){
    saveAISettings();
    if(!state.settings.aiEndpoint){toast('Сначала укажи адрес AI Worker','warn');return;}
    const wasEnabled = state.settings.aiEnabled;
    state.settings.aiEnabled = true;
    try{
      const result = await askAIInternal({
        mode:'chat',
        employeeId:'d1',
        chatId:'chat_d1',
        message:'Поздоровайся с Олегом одной естественной фразой и скажи, что связь с ИИ работает.'
      });
      toast(result?.reply ? 'Связь с ИИ работает' : 'Worker отвечает без текста','good');
    }catch(e){
      state.settings.aiEnabled = wasEnabled;
      save();
      toast('Ошибка ИИ: '+e.message,'danger');
    }
  };

  function findPrivateChat(employeeId){
    return state.chats.find(c=>c.type==='private' && c.participants.includes('ceo') && c.participants.includes(employeeId));
  }

  function applyAIAction(action, actorId, originChatId){
    if(!action || typeof action !== 'object') return;
    const actor = employee(actorId);
    if(action.type==='remember'){
      const target = employee(action.employeeId) || actor;
      if(target && action.text) remember(target,String(action.text).slice(0,500));
      return;
    }
    if(action.type==='send_message'){
      const c = state.chats.find(x=>x.id===action.chatId) || state.chats.find(x=>x.id===originChatId);
      if(c && action.text) pushMessage(c.id,actorId,String(action.text).slice(0,1200),'employee');
      return;
    }
    if(action.type==='create_task'){
      const owner = employee(action.ownerId) || actor;
      if(!owner || actor?.type==='employee') return;
      const t={id:'ait'+state.company.nextId++,title:String(action.title||'Задача от AI').slice(0,160),ownerId:owner.id,dealId:action.dealId||null,projectId:action.projectId||null,priority:action.priority==='High'?'High':'Normal',status:'Open',due:Math.max(1,Number(action.dueDays)||1),createdDay:state.company.day};
      state.tasks.push(t); owner.workload=Math.min(100,owner.workload+6); remember(owner,'Мне назначили задачу: '+t.title); addEvent('🤖','ИИ создал задачу',`${actor.name}: ${t.title}`,'employee',actor.name,'info');
      return;
    }
    if(action.type==='update_deal'){
      const d=deal(action.dealId); if(!d||!actor) return;
      if(!['director','manager'].includes(actor.type) && d.ownerId!==actor.id) return;
      if(stages.includes(action.stage)) d.stage=action.stage;
      const p=Number(action.prob); if(Number.isFinite(p)) d.prob=Math.max(0,Math.min(100,p));
      d.history.push({day:state.company.day,text:`ИИ ${actor.name} обновил сделку: ${stageNames[d.stage]} · ${d.prob}%`});
      addEvent('⌁','ИИ обновил CRM',`${actor.name}: ${d.name} → ${stageNames[d.stage]}, ${d.prob}%`,'crm',actor.name,'info');
      return;
    }
    if(action.type==='create_decision'){
      if(!actor || actor.type!=='director') return;
      const exists=state.decisions.some(d=>d.status==='pending'&&d.title===String(action.title||''));
      if(exists) return;
      state.decisions.unshift({id:'ai_dec'+state.company.nextId++,title:String(action.title||'Решение директора').slice(0,180),source:actor.name,summary:String(action.summary||'AI-директор предлагает управленческое решение.').slice(0,700),options:Array.isArray(action.options)&&action.options.length?action.options:[['approve','Одобрить',0],['hold','Отложить',0]],status:'pending'});
      addEvent('⚖','ИИ предложил решение',`${actor.name}: ${action.title}`,'decision',actor.name,'warn');
    }
    if(action.type==='create_event'){
      addEvent('🤖',String(action.title||'Событие ИИ').slice(0,120),String(action.text||'').slice(0,500),action.category||'system',actor?.name||'AI',action.severity||'info');
    }
  }

  sendChat = window.sendChat = async function(){
    const input=document.getElementById('chatText');
    if(!input) return;
    const text=input.value.trim();
    if(!text) return;
    const c=state.chats.find(x=>x.id===selectedChat);
    if(!c) return;

    chatDraft='';
    input.value='';
    pushMessage(c.id,'ceo',text,'ceo');
    save();
    refreshChatMessages();
    requestAnimationFrame(()=>document.getElementById('chatText')?.focus());

    const primaryId=c.participants.find(id=>id!=='ceo');
    const primary=primaryId ? employee(primaryId) : null;
    if(!primary) return;

    if(state.settings.aiEnabled && state.settings.aiEndpoint){
      toast(primary.name+' формирует ответ…');
      try{
        const result=await askAIInternal({mode:'chat',employeeId:primary.id,message:text,chatId:c.id});
        if(result?.reply){
          pushMessage(c.id,primary.id,String(result.reply).slice(0,1600),'employee');
          remember(primary,'Олег спросил: '+text.slice(0,100)+' Ответ: '+String(result.reply).slice(0,140));
        }
        if(Array.isArray(result?.actions)) result.actions.slice(0,4).forEach(a=>applyAIAction(a,primary.id,c.id));
        save();
        refreshChatMessages();
        requestAnimationFrame(()=>document.getElementById('chatText')?.focus());
      }catch(e){
        toast('ИИ недоступен: '+e.message,'warn');
        const reactions=generateChatResponses(c,text);
        if(reactions.length){
          reactions.forEach((r,i)=>setTimeout(()=>{pushMessage(c.id,r.author,r.text,'employee');const emp=employee(r.author);if(emp)remember(emp,'CEO написал: '+text.slice(0,100));save();refreshChatMessages()},450*(i+1)));
        }
      }
      return;
    }

    const reactions=generateChatResponses(c,text);
    reactions.forEach((r,i)=>setTimeout(()=>{
      pushMessage(c.id,r.author,r.text,'employee');
      const emp=employee(r.author);if(emp)remember(emp,'CEO написал: '+text.slice(0,100));
      save();refreshChatMessages();
    },450*(i+1)));
  };

  window.runAutonomousAI = async function(){
    if(!state.settings.aiEnabled || !state.settings.aiAutonomy || !state.settings.aiEndpoint) return;
    const directors=activeEmployees().filter(e=>e.type==='director');
    for(const d of directors){
      try{
        const result=await askAIInternal({mode:'agent',employeeId:d.id,chatId:'board',message:'Проанализируй текущее состояние компании. Действуй только в пределах своей роли. Не создавай активность без причины. Если нужно действие — предложи максимум 3 конкретных действия.'});
        if(Array.isArray(result?.actions)) result.actions.slice(0,4).forEach(a=>applyAIAction(a,d.id,'board'));
        if(result?.reply && result?.actions?.length) pushMessage('board',d.id,String(result.reply).slice(0,1200),'employee');
        remember(d,'Автономный AI-анализ: '+String(result?.reply||'Без новых действий').slice(0,180));
      }catch(e){
        addEvent('⚠','Ошибка AI-директора',`${d.name}: ${e.message}`,'system',d.name,'warn');
      }
    }
    save();
    if(currentPage==='messenger'||currentPage==='dashboard'||currentPage==='observer'||currentPage==='decisions') renderPage();
  };

  let aiLastHourKey='';
  setInterval(()=>{
    if(!state.company.running || !state.settings.aiEnabled || !state.settings.aiAutonomy || !state.settings.aiEndpoint) return;
    const key=state.company.day+'-'+state.company.hour;
    if(state.company.hour%6===0 && key!==aiLastHourKey){
      aiLastHourKey=key;
      runAutonomousAI();
    }
  },4000);

  // Русские подписи AI-панели уже заданы напрямую; общий перевод интерфейса остаётся штатным.

  // Фикс: AI reply не перерисовывает страницу и не уничтожает поле ввода.
  const originalStartTimer = window.startTimer;
  window.startTimer = function(){
    originalStartTimer();
    if(currentPage==='messenger') refreshChatMessages();
  };

  // После первоначальной отрисовки добавляем AI-настройки в уже открытом состоянии.
  if(currentPage==='settings') renderPage();
})();

// ALATAU AI HOTFIX END
</script>
<script>
/* ALATAU NEXUS — YEAR-LONG LIVE COMPANY ENGINE */
(function(){
  'use strict';

  const YEAR_ENGINE_VERSION = 12;

  const oldSeedState = seedState;

  function hash(n){
    const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function monthOfDay(day){ return Math.floor((day - 1) / 30) + 1; }
  function yearOfDay(day){ return Math.floor((day - 1) / 365) + 1; }
  function dayOfWeek(day){ return ((day - 1) % 7) + 1; } // 1=Mon
  function isWorkday(day){ const w = dayOfWeek(day); return w <= 5; }
  function moneyRate(v){ return Math.round(v * 100) / 100; }

  function chooseLeastLoaded(items){
    const list = (items||[]).map(x=>typeof x==='string'?employee(x):x).filter(Boolean).filter(e=>e.status==='active');
    const loadScore=e=>{
      const queue=state.tasks.filter(t=>t.status!=='Done'&&t.ownerId===e.id).length;
      const active=e.currentTask?1:0;
      return queue*8 + active*12 + e.workload*0.35;
    };
    return list.sort((a,b)=>(loadScore(a)-loadScore(b))||(b.kpi-a.kpi))[0] || null;
  }

  function salesOwners(){
    return activeEmployees().filter(e=>['sales','bizdev'].includes(e.department) && e.type!=='ceo');
  }

  function techOwners(){
    return activeEmployees().filter(e=>['engineering','qa','product'].includes(e.department));
  }

  function customerOwners(){
    return activeEmployees().filter(e=>e.department==='customer_success');
  }

  function ensureWorldState(s){
    s.world = s.world || {};
    const w = s.world;
    w.version = YEAR_ENGINE_VERSION;
    w.leadSeq = Number(w.leadSeq)||0;
    w.lastLeadDay = Number.isFinite(w.lastLeadDay)?w.lastLeadDay:0;
    w.lastStandupDay = Number.isFinite(w.lastStandupDay)?w.lastStandupDay:0;
    w.lastBoardDay = Number.isFinite(w.lastBoardDay)?w.lastBoardDay:0;
    w.lastIssueDay = Number.isFinite(w.lastIssueDay)?w.lastIssueDay:0;
    w.lastOpsDay = Number.isFinite(w.lastOpsDay)?w.lastOpsDay:0;
    w.lastMonthReview = Number.isFinite(w.lastMonthReview)?w.lastMonthReview:0;
    w.leadsCreated = Number(w.leadsCreated)||0;
    w.leadsQualified = Number(w.leadsQualified)||0;
    w.dealsWon = Number(w.dealsWon)||0;
    w.dealsLost = Number(w.dealsLost)||0;
    w.decisionsExpired = Number(w.decisionsExpired)||0;
    w.decisionsCreated = Number(w.decisionsCreated)||0;
    w.recurringRevenueDaily = Number(w.recurringRevenueDaily)||0;
    w.oneTimeRevenue = Number(w.oneTimeRevenue)||0;
    w.contracts = Array.isArray(w.contracts)?w.contracts:[];
    w.yearly = w.yearly || {startRevenue:s.finance.revenue||0,startCash:s.finance.cash||0};
    w.lastDailySnapshot = Number(w.lastDailySnapshot)||0;
    w.lastMessageDay = w.lastMessageDay || {};
    w.lastDecisionDay = Number.isFinite(w.lastDecisionDay)?w.lastDecisionDay:0;
    w.decisionYear = Number(w.decisionYear)||yearOfDay(s.company.day);
    w.decisionsCreatedYear = Number(w.decisionsCreatedYear)||0;

    s.clients.forEach(c=>{
      if(!Number.isFinite(c.lastContactDay)) c.lastContactDay = s.company.day;
      if(!Number.isFinite(c.lastIssueDay)) c.lastIssueDay = 0;
      if(!Number.isFinite(c.renewalDay)) c.renewalDay = s.company.day + 330 + Math.round(hash(Number(String(c.id).replace(/\D/g,'')||1))*30);
      if(c.leadSource===undefined) c.leadSource = 'Existing network';
      if(c.openIssue===undefined) c.openIssue = null;
      if(c.status===undefined) c.status = 'active';
    });

    s.deals.forEach(d=>{
      if(!Number.isFinite(d.stageStartedDay)) d.stageStartedDay = Number(d.createdDay)||1;
      if(!Number.isFinite(d.nextActionDay)) d.nextActionDay = Number(d.lastActionDay||s.company.day)+1;
      if(!Number.isFinite(d.lastContactDay)) d.lastContactDay = Number(d.lastActionDay||s.company.day);
      if(!Number.isFinite(d.meetingCount)) d.meetingCount = 0;
      if(!Number.isFinite(d.issueCount)) d.issueCount = 0;
      if(!Number.isFinite(d.marginRate)) d.marginRate = d.value ? d.margin/d.value : .38;
      if(!Number.isFinite(d.monthlyValue)) d.monthlyValue = d.value/12;
      if(d.issue===undefined) d.issue = null;
      if(d.status===undefined) d.status = 'active';
      if(d.ownerId) d.managerId = d.managerId || employee(d.ownerId)?.managerId || 'm1';
    });

    s.projects.forEach(p=>{
      if(!Number.isFinite(p.stageStartedDay)) p.stageStartedDay = s.company.day;
      if(!Number.isFinite(p.lastMilestone)) p.lastMilestone = Math.floor((p.progress||0)/10)*10;
      if(!Number.isFinite(p.monthlyBurn)) p.monthlyBurn = Math.max(25000,(p.budget||0)/Math.max(30,(p.deadline-s.company.day||30)));
      if(!Number.isFinite(p.pendingBilling)) p.pendingBilling=0;
      if(!Number.isFinite(p.lastIssueDay)) p.lastIssueDay = 0;
    });

    s.tasks.forEach(t=>{
      if(!Number.isFinite(t.progress)) t.progress = t.status==='Done'?100:0;
      if(t.kind===undefined) t.kind = t.dealId ? 'deal' : t.projectId ? 'project' : 'operations';
      if(!Number.isFinite(t.createdDay)) t.createdDay=s.company.day;
      if(!Number.isFinite(t.dueDay)) t.dueDay=s.company.day+(Number(t.due)||2);
    });

    s.chats.forEach(c=>{
      c.messages = Array.isArray(c.messages)?c.messages:[];
      c.messages = c.messages.slice(-80);
    });
    ensureExecutiveAndRooms(s);
    ensureRunningEmployees(s);
    return s;
  }

  function ensureExecutiveAndRooms(s){
    ensureRoom(s,'board','Руководители','group',['ceo','d1','d2','d3','d4','d5'],'Ежедневная управленческая координация');
    ensureRoom(s,'sales-room','Планёрка продаж','group',['d1','m1','m2','e01','e02','e03'],'Продажи, лиды, сделки и клиенты');
    ensureRoom(s,'tech-room','Техническая планёрка','group',['d2','m3','m4','m10'],'Проекты, качество и технические риски');
    ensureRoom(s,'ops-room','Операционная планёрка','group',['d5','m7','m8','m9'],'Сервис, операции, клиенты и маркетинг');
  }

  function ensureRoom(s,id,name,type,participants,topic){
    if(!s.chats.some(c=>c.id===id)) s.chats.push({id,name,type,participants:[...participants],topic,last:'',updated:0,messages:[]});
  }

  function ensureRunningEmployees(s){
    activeEmployees().filter(e=>e.type!=='ceo').forEach(e=>{
      if(e.currentTask && !task(e.currentTask)) e.currentTask=null;

  function ensureDealRoom(d){

    const participants=[d.ownerId,manager?.id,'d1'];
    if(['Technology','Finance'].includes(clientObj?.industry)) participants.push('d2');

    if(['Won','Negotiation'].includes(d.stage)) participants.push('m8');
    const unique=[...new Set(participants.filter(Boolean))];
    c={id:key,name:`${clientObj?.name||'Клиент'} · ${d.name}`,type:'group',participants:['ceo',...unique.filter(x=>x!=='ceo')],topic:'Работа по клиенту',last:'',updated:0,messages:[]};

  function createWorkTask(title,ownerId,dealId=null,projectId=null,priority='Normal',dueDays=2,kind='operations'){

    const same=state.tasks.find(t=>t.status!=='Done'&&t.ownerId===ownerId&&t.title===title);

    const t={id:'wrk'+state.company.nextId++,title,ownerId,dealId,projectId,priority,status:'Open',due:dueDays,createdDay:state.company.day,dueDay:state.company.day+dueDays,progress:0,kind};

  function maybeGenerateLead(){

    if(!isWorkday(day)) return;
    const h=hash(day*17+state.world.leadSeq*7);
    const active=state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).length;

    // Поток замедляется только при реально перегруженном pipeline.
    if(active>=55 && h>.20) return;
    if(h>.39) return;
    const count=h<.10 ? 2 : 1;
    for(let n=0;n<count;n++) createLead(day,n);
  }

  function generateDealProblem(d){
    if(!d||['Won','Lost'].includes(d.stage)||d.issue) return;
    if(d.stage==='Lead'||d.stage==='Contacted') return;
    const age=state.company.day-(d.lastIssueDay||d.stageStartedDay||state.company.day);
    if(age<7)return;
    const trigger=hash(state.company.day*23 + String(d.id).length*11 + d.value%101);
    if(trigger>.22)return;
    const c=client(d.clientId),o=dealOwner(d);
    const issues=[
      {key:'discount',title:'Клиент просит дополнительную скидку',severity:2,summary:`${c?.name||'Клиент'} готов двигаться, но просит снизить цену на 4–6%.`,options:[['A','Согласовать 5% скидки','discount_deep',-5],['B','Предложить 2% + сервис','discount_light',1],['C','Держать цену и усилить ценность','hold_price',-2]],tradeoffs:{A:'Выше шанс закрытия, ниже маржа.',B:'Компромисс: небольшая скидка и дополнительная нагрузка.',C:'Маржа сохраняется, но сделка может затянуться.'}},
      {key:'scope',title:'Клиент расширил scope',severity:2,summary:`${c?.name||'Клиент'} просит дополнительные функции до подписания. Engineering оценивает это как дополнительный объём.`,options:[['A','Взять scope в текущий бюджет','scope_full',-8],['B','Разбить scope на этапы','scope_split',3],['C','Отложить дополнительный scope','scope_hold',-3]],tradeoffs:{A:'Быстрее закрытие, выше производственная нагрузка.',B:'Баланс сроков и ценности, но нужно управлять ожиданиями.',C:'Защита команды, но часть ценности может уйти конкуренту.'}},
      {key:'legal',title:'Юристы клиента прислали новые условия',severity:1,summary:`Нужно согласовать договорные формулировки и SLA. Каждый вариант влияет на срок сделки.`,options:[['A','Принять большую часть правок','legal_accept',4],['B','Вернуть с компромиссным SLA','legal_balance',2],['C','Держать исходную позицию','legal_hold',-4]],tradeoffs:{A:'Быстрее к подписанию, выше обязательства.',B:'Средний путь по срокам и рискам.',C:'Сохраняет позицию компании, но увеличивает задержку.'}},
      {key:'deadline',title:'Клиент хочет ускорить запуск',severity:2,summary:`Клиент просит запуск раньше согласованного срока. COO и CTO видят риск перегрузки команды.`,options:[['A','Ускорить за счёт ресурса','deadline_fast',6],['B','Запустить сокращённый MVP','deadline_mvp',4],['C','Сохранить текущий срок','deadline_keep',-3]],tradeoffs:{A:'Выше шанс удержать клиента, выше себестоимость.',B:'Баланс между сроком и объёмом.',C:'Команда защищена, но клиент может быть недоволен.'}}
    ];
    const issue=issues[Math.floor(trigger*issues.length)%issues.length];
    d.issue={key:issue.key,title:issue.title,summary:issue.summary,createdDay:state.company.day,severity:issue.severity,tradeoffs:issue.tradeoffs};
    d.issueCount=(d.issueCount||0)+1;
    d.lastIssueDay=state.company.day;
    d.prob=Math.max(8,d.prob-(issue.severity*4));
    d.history.unshift({day:state.company.day,text:`Проблема клиента: ${issue.title}`});
    if(c)c.health=Math.max(35,c.health-issue.severity*2);
    sayInDeal(d,o?.id||'d1',`У клиента новая проблема: ${issue.title.toLowerCase()}. Нужно решить, как идём дальше.`);
    if(issue.key==='deadline') sayInDeal(d,'d2',`Я вижу технический риск. Ускорение возможно, но только с явным решением по ресурсам.`);
    if(issue.key==='discount') sayInDeal(d,'d3',`Перед любым снижением цены хочу видеть влияние на маржу и cash.`);
    if(issue.key==='scope') sayInDeal(d,'d2',`Дополнительный scope лучше зафиксировать отдельно, иначе срок проекта поползёт.`);
    addEvent('⚠','Проблема с клиентом',`${d.name}: ${issue.title}. Требуется управленческое решение.`,'client',o?.name||'Sales','warn');
    const high=(d.value>=10000000 || issue.severity>=2);

    else createWorkTask(`Разобрать проблему клиента: ${issue.title}`,dealManager(d)?.id||'d1',d.id,null,'High',3,'client-issue');
  }

  function canCreateYearDecision(minGap=6){
    const yr=yearOfDay(state.company.day);
    if(state.world.decisionYear!==yr){
      state.world.decisionYear=yr;
      state.world.decisionsCreatedYear=0;
      state.world.lastDecisionDay=0;
    }
    return state.company.day-(state.world.lastDecisionDay||0)>=minGap && (state.world.decisionsCreatedYear||0)<24;
  }

  function createIssueDecision(d,issue){
    const existing=state.decisions.find(x=>x.status==='pending'&&x.dealId===d.id&&x.yearProblem===issue.key);
    if(existing)return;
    // CEO получает управленческие запросы регулярно, но не превращаем компанию в спам из 100 решений.
    if(!canCreateYearDecision(6)) return;
    const dopt=issue.key==='discount' ? issue.options : issue.options;
    const dec={
      id:'yd'+state.company.nextId++,title:`${client(d.clientId)?.name||'Клиент'} · ${issue.title}`,source:'Sales Director',risk:issue.key,status:'pending',summary:issue.summary,options:dopt,optionDetails:issue.tradeoffs,createdDay:state.company.day,dueDay:state.company.day+4,dealId:d.id,yearDecision:true,yearProblem:issue.key,resolution:null
    };
    state.decisions.unshift(dec);
    state.world.decisionsCreated=(state.world.decisionsCreated||0)+1;
    state.world.decisionsCreatedYear=(state.world.decisionsCreatedYear||0)+1;
    state.world.lastDecisionDay=state.company.day;
    addEvent('⚖','Нужно решение CEO',`${dec.title}. До решения клиента нужно удержать в работе.`,'decision','Александр Волков','warn');
    sayInDeal(d,'d1',`Олег, нужен твой выбор по проблеме. Я подготовил три варианта. Пока решение не принято, переговоры будут идти осторожно.`);
  }

  function applyYearDecision(d,choice){
    const dealX=d.dealId?deal(d.dealId):null;
    const choiceMap={
      discount_deep:{prob:10,margin:-.05,health:2,workload:4,text:'Согласовали 5% скидки. Вероятность сделки выросла, но маржа снизилась.'},
      discount_light:{prob:6,margin:-.02,health:2,workload:2,text:'Предложили 2% скидки и сервис. Сохранили большую часть маржи.'},
      hold_price:{prob:-3,margin:0,health:-1,workload:0,text:'Цена сохранена. Сделка может идти дольше, но маржа защищена.'},
      scope_full:{prob:7,margin:-.04,health:1,workload:7,text:'Дополнительный scope взяли в текущую экономику. Риск нагрузки вырос.'},
      scope_split:{prob:5,margin:-.01,health:2,workload:3,text:'Scope разбили на этапы. Клиент получил путь, команда сохранила контроль.'},
      scope_hold:{prob:-3,margin:0,health:-2,workload:-1,text:'Дополнительный scope отложен. Команда защищена, но клиент недоволен.'},
      legal_accept:{prob:6,margin:-.01,health:2,workload:1,text:'Большую часть правок приняли, чтобы ускорить подписание.'},
      legal_balance:{prob:4,margin:0,health:1,workload:0,text:'Стороны согласовали компромиссный SLA.'},
      legal_hold:{prob:-5,margin:0,health:-2,workload:0,text:'Исходная позиция сохранена, переговоры замедлились.'},
      deadline_fast:{prob:6,margin:-.03,health:2,workload:7,text:'Запуск ускоряем за счёт ресурса. Себестоимость и нагрузка выросли.'},
      deadline_mvp:{prob:5,margin:-.01,health:3,workload:3,text:'Предложили сокращённый MVP и сохранили управляемый срок.'},
      deadline_keep:{prob:-3,margin:0,health:-1,workload:-1,text:'Сохранили первоначальный срок, защищая команду.'}
    };
    const effect=choiceMap[choice];
    if(!effect) return;
    if(dealX){
      dealX.prob=Math.max(5,Math.min(95,dealX.prob+effect.prob));
      dealX.marginRate=Math.max(.15,Math.min(.45,(dealX.marginRate||.38)+effect.margin));
      dealX.margin=dealX.value*dealX.marginRate;
      dealX.issue=null;
      dealX.lastActionDay=state.company.day;
      dealX.stageStartedDay=Math.min(dealX.stageStartedDay,state.company.day);
      dealX.history.unshift({day:state.company.day,text:`CEO: ${effect.text}`});
      const c=client(dealX.clientId);if(c)c.health=Math.max(30,Math.min(100,c.health+effect.health));
      const o=dealOwner(dealX);if(o)o.workload=Math.min(100,o.workload+effect.workload);
      sayInDeal(dealX,'d1',`CEO выбрал вариант «${choice}». ${effect.text}`);
      if(dealX.ownerId) sayInDeal(dealX,dealX.ownerId,`Понял. Тогда действую по выбранному сценарию и дам следующий статус.`);
      createWorkTask(`Исполнить решение CEO по ${dealX.name}`,dealManager(dealX)?.id||'d1',dealX.id,null,'High',3,'decision-followup');
    }
  }

  function expireDecisionYear(d){
    const dealX=d.dealId?deal(d.dealId):null;
    d.status='expired';d.resolution='Решение не принято вовремя';
    state.world.decisionsExpired++;
    if(dealX){dealX.prob=Math.max(5,dealX.prob-10);dealX.issue=null;dealX.lastIssueDay=state.company.day;dealX.nextActionDay=state.company.day+2;const c=client(dealX.clientId);if(c)c.health=Math.max(30,c.health-5);dealX.history.unshift({day:state.company.day,text:'CEO не принял решение в срок; клиентский риск вырос, но команда продолжает работу.'});sayInDeal(dealX,'d1','Мы слишком долго принимали решение. Клиент почувствовал задержку; команда продолжает работу, но вернуть темп будет сложнее.');createWorkTask(`Восстановить переговоры после просроченного решения: ${dealX.name}`,dealManager(dealX)?.id||'d1',dealX.id,null,'High',3,'decision-followup');stageTask(dealX);}

  function processYearTasks(){
    state.tasks.filter(t=>t.status!=='Done').forEach(t=>{
      const e=employee(t.ownerId); if(!e||e.status!=='active') return;
      if(!e.currentTask && e.workload<94){
        t.status='In Progress';e.currentTask=t.id;
        e.workload=Math.min(100,e.workload+3);
        addEvent('▶','Сотрудник начал работу',`${e.name}: ${t.title}.`,'employee',e.name,'info');
      }
      if(t.status==='In Progress'){
        const efficiency=.10 + e.kpi/1300 + e.energy/2500 - (e.workload>88?.05:0);
        t.progress=Math.min(100,(t.progress||0)+Math.max(.035,efficiency));
        e.workload=Math.min(100,e.workload+.20);
        e.energy=Math.max(20,e.energy-.08);
        if(t.progress>=100) finishYearTask(t);
      }
      if(state.company.day>(t.dueDay??(t.createdDay+2)) && t.status!=='Done'){
        t.overdue=true;
        const overdueDays=state.company.day-(t.dueDay||0);
        if(overdueDays===3){
          const mgr=e.managerId?employee(e.managerId):null;
          if(mgr) addMessageState(state,'board',mgr.id,`${e.name} просрочил задачу «${t.title}» на ${overdueDays} дня. Нужен контроль и приоритет.`,'employee');
        }
        if(overdueDays%3===0) addEvent('⚠','Просрочена задача',`${t.title} · ${e.name}`,'employee',e.name,'warn');
      }
    });
  }

  function finishYearTask(t){
    if(t.status==='Done')return;
    t.status='Done';t.progress=100;
    const e=employee(t.ownerId);if(e){if(e.currentTask===t.id)e.currentTask=null;e.workload=Math.max(18,e.workload-4);e.energy=Math.max(20,e.energy-1);e.kpi=Math.min(100,e.kpi+.3);remember(e,'Завершил: '+t.title)}
    if(t.dealId){
      const d=deal(t.dealId);
      if(d&&!['Won','Lost'].includes(d.stage)){
        d.prob=Math.min(95,d.prob+4);
        d.lastActionDay=state.company.day;
        d.nextActionDay=state.company.day+1;
        d.history.unshift({day:state.company.day,text:`Связанная задача выполнена: ${t.title}`});
        if((t.kind==='deal-stage'||t.kind==='deal') && !['Lost','Won'].includes(d.stage) && state.company.day>=d.stageStartedDay+1){
          const next={Lead:'Contacted',Contacted:'Discovery',Discovery:'Proposal',Proposal:'Negotiation'}[d.stage];
          if(next) advanceDealStageYear(d,next,'Связанная рабочая задача завершена.');
        }
        if(d.stage==='Negotiation' && !d.issue && state.company.day>=d.stageStartedDay+5){
          const age=state.company.day-d.stageStartedDay;
          const closeChance=d.prob>=82?.28:d.prob>=68?.20:d.prob>=55?.14:d.prob>=45?.08:.025;
          if(d.prob>=40 && hash(state.company.day*19+d.value%97)<closeChance) closeWonYear(d);
          else if(age>18 && d.prob<45 && hash(state.company.day*29+d.value%53)<.22) closeLostYear(d,'клиент не подтвердил финальные условия');
        }
      }
    }
    if(t.dealId && ['client-issue','stalled-deal','decision-followup'].includes(t.kind)){
      const d=deal(t.dealId);
      if(d){
        if(d.issue){
          d.issue=null;
          d.lastIssueDay=state.company.day;
          d.prob=Math.min(95,d.prob+4);
          d.history.unshift({day:state.company.day,text:'Проблема отработана рабочей командой; сделка снова в активном движении.'});
          sayInDeal(d,t.ownerId,`Проблему закрыли с нашей стороны. Возвращаемся к следующему этапу и держим клиента в контакте.`);
          addEvent('✓','Проблема клиента отработана',`${d.name}: команда закрыла рабочий вопрос.`,'client',employee(t.ownerId)?.name||'Система','good');
          stageTask(d);
        }
      }
    }
    if(t.projectId){
      const p=project(t.projectId);if(p){p.progress=Math.min(100,p.progress+4);p.risk=Math.max(3,p.risk-1);if(p.progress>=100)finishProjectYear(p);}
    }
    addEvent('✓','Сотрудник завершил задачу',`${e?.name||'Сотрудник'}: ${t.title}.`,'employee',e?.name||'Система','good');
  }

  function finishProjectYear(p){
    if(p.status==='Done')return;
    p.status='Done';p.progress=100;p.risk=0;
    const m=employee(p.managerId),c=client(p.clientId);
    addEvent('▣','Проект завершён',`${p.name} завершён. Руководитель: ${m?.name||'—'}.`,'project',m?.name||'Operations','good');
    createWorkTask(`Провести post-project review: ${p.name}`,p.managerId,null,p.id,'Normal',3,'project-review');
    if(c){c.health=Math.min(100,c.health+4);c.lastContactDay=state.company.day;}
  }

  function processYearDeals(){
    state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).forEach(d=>{
      const o=dealOwner(d),c=client(d.clientId);if(!o||!c)return;
      if(state.company.day>=d.nextActionDay){
        d.lastActionDay=state.company.day;
        d.nextActionDay=state.company.day+2;
        if(hash(state.company.day*7+d.value%89)<.58){
          d.prob=Math.min(95,d.prob+1.2);
          d.history.unshift({day:state.company.day,text:`Контакт по клиенту выполнен ответственным ${o.name}.`});
          sayInDeal(d,o.id,`Связался с ${c.name}. Пока рабочий статус стабильный, продолжаю двигать следующий шаг.`);
        } else if(hash(state.company.day*11+d.value%67)<.28){
          d.prob=Math.max(5,d.prob-1.5);
          sayInDeal(d,o.id,`Клиент пока не ответил. Оставляю follow-up и переношу следующий контакт.`);
        }
      }

      const age=state.company.day-(d.stageStartedDay||d.createdDay);
      const maxAge={Lead:7,Contacted:10,Discovery:14,Proposal:18,Negotiation:21}[d.stage]||14;
      if(d.stage==='Lead' && age>16 && d.prob<20 && !d.issue){
        if(hash(state.company.day*41+d.value%71)<.18) closeLostYear(d,'лид не квалифицирован и не вышел на ЛПР');
      }
      if(d.stage==='Discovery' && age>34 && d.prob<25 && !d.issue){
        if(hash(state.company.day*47+d.value%61)<.15) closeLostYear(d,'клиент не подтвердил приоритет проекта');
      }
      if(d.stage==='Proposal' && age>40 && d.prob<30 && !d.issue){
        if(hash(state.company.day*53+d.value%43)<.15) closeLostYear(d,'коммерческое предложение не перешло в переговоры');
      }
      if(age>maxAge && !d.issue){
        if((state.company.day-(d.lastStallTaskDay||0))>=5){
          d.lastStallTaskDay=state.company.day;
          d.prob=Math.max(10,d.prob-1.5);
          createWorkTask(`Разобрать затянувшийся этап ${d.name}`,dealManager(d)?.id||'d1',d.id,null,'High',2,'stalled-deal');
        }
        if(d.issueCount<2 && (d.prob<30 || age>maxAge+10)) generateDealProblem(d);
      }

      if(d.stage==='Negotiation' && !d.issue && d.issueCount<2 && state.company.day-(d.lastIssueDay||0)>7) generateDealProblem(d);
      if(d.stage==='Negotiation' && !d.issue && age>=5){
        const chance=d.prob>=82?.22:d.prob>=68?.16:d.prob>=55?.10:d.prob>=45?.045:.015;
        if(d.prob>=45 && hash(state.company.day*61+d.value%73)<chance) closeWonYear(d);
        else if(age>42 && d.prob<42 && hash(state.company.day*67+d.value%67)<.12) closeLostYear(d,'переговоры затянулись и приоритет клиента снизился');
      }
      // Рыночная динамика: если команда достаточно продвинула сделку и нет блокера,
      // клиент может сам ответить/согласовать следующий этап. Задачи и чаты остаются
      // доказательством работы, но pipeline не должен зависать только из-за очереди UI-задач.
      if(!d.issue){
        const stageFlow={
          Lead:{delay:5,minProb:28,next:'Contacted'},
          Contacted:{delay:6,minProb:34,next:'Discovery'},
          Discovery:{delay:8,minProb:44,next:'Proposal'},
          Proposal:{delay:10,minProb:54,next:'Negotiation'}
        }[d.stage];
        const stageAge=state.company.day-(d.stageStartedDay||d.createdDay||state.company.day);
        if(stageFlow && stageAge>=stageFlow.delay && d.prob>=stageFlow.minProb){
          const responseChance={Lead:.12,Contacted:.10,Discovery:.08,Proposal:.06}[d.stage];
          if(hash(state.company.day*71+d.value%83)<responseChance){
            advanceDealStageYear(d,stageFlow.next,'Клиент подтвердил следующий шаг после рабочего контакта.');
          }
        }
      }

      if(d.stage!=='Lead' && state.company.day-(d.lastContactDay||0)>=4){
        d.lastContactDay=state.company.day;
        if(hash(state.company.day*13+d.value%47)<.55) {
          const other = d.stage==='Proposal' ? 'd3' : (d.stage==='Negotiation' ? 'm8' : dealManager(d)?.id);
          if(other && employee(other)) sayInDeal(d,other,`${c.name}: держу в поле зрения. Какой следующий риск по этой сделке?`);
        }
      }
    });
  }

  function billProjectMilestones(p){
    if(!p||p.status==='Done') return;
    const stages=[30,70,100];
    const c=client(p.clientId);
    stages.forEach((threshold,i)=>{
      if(p.progress < threshold || p.billedStages?.includes(threshold)) return;
      p.billedStages=p.billedStages||[];
      const amount=Math.round((p.budget||0)*(p.billingPlan?.[i]??(1/stages.length)));
      const cash=Math.round(amount*.70);
      const receivable=amount-cash;
      state.finance.revenue += amount;
      state.finance.cash += cash;
      state.finance.receivables += receivable;
      state.world.oneTimeRevenue += amount;
      p.pendingBilling=0;
      p.billedStages.push(threshold);
      addEvent('₸','Выставлен счёт по проекту',`${p.name}: milestone ${threshold}% · ${money(amount)}. Клиент: ${c?.name||'—'}.`,'finance',employee(p.managerId)?.name||'Operations','good');
      const manager=employee(p.managerId);
      if(manager) addMessageState(state,'ops-room',manager.id,`По ${p.name} выставили счёт ${money(amount)} после milestone ${threshold}%.`,'employee');
    });
  }

  function processYearProjects(){
    state.projects.filter(p=>p.status!=='Done').forEach(p=>{
      const m=employee(p.managerId);if(!m)return;
      const activePeople=activeEmployees().filter(e=>e.department==='engineering'||e.department==='qa'||e.department==='product');
      const avgKpi=activePeople.length?avg(activePeople.map(e=>e.kpi)):75;
      let delta=.025 + avgKpi/20000;
      if(m.workload>88)delta-=.05;
      if(p.risk>45)delta-=.06;
      p.progress=Math.min(99.5,p.progress+Math.max(.025,delta));
      if(Math.floor(p.progress/10)>p.lastMilestone){
        p.lastMilestone=Math.floor(p.progress/10)*10;
        createWorkTask(`Проверить milestone ${p.lastMilestone}% — ${p.name}`,m.id,null,p.id,'Normal',3,'project-milestone');
        addEvent('▣','Milestone проекта',`${p.name}: достигнуто ${p.lastMilestone}% прогресса.`,'project',m.name,'info');
        if(p.lastMilestone%20===0) addMessageState(state,'tech-room',m.id,`По ${p.name} прошли milestone ${p.lastMilestone}%. Следующий риск — ${Math.round(p.risk)}%.`,'employee');
      }
      if(state.company.day>=p.deadline-7 && p.progress<80)p.risk=Math.min(95,p.risk+1.1);
      if(p.risk>48 && state.company.day-(p.lastIssueDay||0)>6){
        p.lastIssueDay=state.company.day;
        addEvent('⚠','Риск проекта растёт',`${p.name}: риск ${Math.round(p.risk)}%. CTO и руководитель проекта обсуждают план.`,'project',m.name,'warn');
        addMessageState(state,'tech-room','d2',`По ${p.name} риск уже ${Math.round(p.risk)}%. Предлагаю отдельно обсудить ресурс и срок.`,'employee');
        if(p.risk>60 && !state.decisions.some(d=>d.status==='pending'&&d.projectId===p.id) && canCreateYearDecision(6)){
          state.world.lastDecisionDay=state.company.day; state.world.decisionsCreated=(state.world.decisionsCreated||0)+1; state.world.decisionsCreatedYear=(state.world.decisionsCreatedYear||0)+1;
          state.decisions.unshift({id:'yp'+state.company.nextId++,title:`${p.name} · риск delivery`,source:'CTO',risk:'delivery',status:'pending',summary:`Риск ${Math.round(p.risk)}%. CEO может усилить команду, сократить scope или сохранить текущий план.`,options:[['A','Усилить команду','project_staff',1],['B','Сократить scope первого релиза','project_scope',2],['C','Сохранить текущий план','project_hold',-2]],optionDetails:{A:'Стоимость выше, срок безопаснее.',B:'Сохраняется срок, часть функций переносится.',C:'Бюджет не меняется, но риск срыва выше.'},createdDay:state.company.day,dueDay:state.company.day+4,projectId:p.id,yearDecision:true,yearProblem:'delivery'});
          addMessageState(state,'board','d2',`Олег, по ${p.name} уже нужен выбор: ресурс, scope или сохранение плана.`,'employee');
        }
      }
      billProjectMilestones(p);
      if(p.progress>=100 || (state.company.day>=p.deadline&&p.progress>88))finishProjectYear(p);
    });
  }

  function processYearClients(){
    state.clients.forEach(c=>{
      const openDeals=state.deals.filter(d=>d.clientId===c.id&&!['Lost','Won'].includes(d.stage));
      const contracts=state.world.contracts.filter(x=>x.clientId===c.id&&x.active&&x.endDay>=state.company.day);
      if(contracts.length)c.health=Math.min(100,c.health+(state.company.day%4===0?.06:0));

      if(c.health<48 && state.company.day-(c.lastIssueDay||0)>5){

        const cs=chooseLeastLoaded(customerOwners());
        if(cs){
          createWorkTask(`План восстановления клиента ${c.name}`,cs.id,null,null,'High',3,'client-recovery');
          addEvent('♥','Клиент под риском',`${c.name}: health ${Math.round(c.health)}%. ${cs.name} получил план восстановления.`,'client',cs.name,'warn');
          const room=state.deals.find(d=>d.clientId===c.id&&!['Lost'].includes(d.stage));if(room)sayInDeal(room,cs.id,`Вижу просадку health у ${c.name}. Я беру на себя план восстановления и дам апдейт.`);

  function createLeadForRenewal(c,contract){
    const owner=chooseLeastLoaded(customerOwners().concat(salesOwners()));
    if(!owner)return;
    const d={id:'deal'+state.company.nextId++,name:`${c.name} · Продление и расширение`,clientId:c.id,ownerId:owner.id,managerId:owner.managerId||'m1',value:Math.round(contract.monthlyValue*12*1.08),stage:'Discovery',prob:58,marginRate:.42,margin:Math.round(contract.monthlyValue*12*1.08*.42),next:'Провести renewal review',createdDay:state.company.day,lastActionDay:state.company.day,nextActionDay:state.company.day+2,stageStartedDay:state.company.day,meetingCount:0,issueCount:0,issue:null,status:'active',source:'Продление',history:[{day:state.company.day,text:'Запущен renewal review по действующему контракту.'}]};
    state.deals.push(d);

        if(hash(state.company.day+c.id.length)<.18){

          addEvent('✕','Риск оттока клиента',`${clientObj.name}: контракт остановлен из-за низкого health.`,'client','Customer Success','warn');

  function processYearFinance(){
    const f=state.finance;
    const activeContracts=state.world.contracts.filter(c=>c.active&&c.endDay>=state.company.day);
    const recurringDaily=activeContracts.reduce((a,c)=>a+c.monthlyValue/30,0);
    state.world.recurringRevenueDaily=recurringDaily;
    const hourlyRevenue=recurringDaily/24;
    let oneTime=0;
    state.projects.forEach(p=>{
      const pending=Number(p.pendingBilling)||0;
      if(pending>0){ oneTime += pending/24; p.pendingBilling=Math.max(0,pending-pending/24); }
    });
    const recognized=hourlyRevenue+oneTime;
    const payroll=activeEmployees().filter(e=>e.type!=='ceo').reduce((a,e)=>a+e.salary,0);
    const hourlyPayroll=payroll/30/24;
    const hourlyFixed=1600000/30/24;
    const hourlyProjectBurn=state.projects.filter(p=>p.status!=='Done').reduce((a,p)=>a+p.monthlyBurn,0)/30/24;
    const hourlyMarketing=260000/30/24;
    const cogs=recognized*.22;
    const cashFromRevenue=recognized*.70;
    const receivableFromRevenue=recognized*.30;
    f.revenue += recognized;
    f.costOfSales += cogs;
    f.payroll=payroll;
    f.operatingExpenses += hourlyPayroll+hourlyFixed+hourlyProjectBurn+hourlyMarketing;
    f.cash += cashFromRevenue-hourlyPayroll-hourlyFixed-hourlyProjectBurn-hourlyMarketing;
    f.receivables += receivableFromRevenue;
    if(state.company.hour===23 && state.company.day%15===0){
      const collection=Math.min(f.receivables,f.receivables*.58);
      f.cash += collection;
      f.receivables -= collection;
    }
    f.profit=f.revenue-f.costOfSales-f.operatingExpenses;
    f.burn=Math.max(0,Math.round(f.operatingExpenses/30));
    if(f.cash<5000000&&!state.decisions.some(d=>d.status==='pending'&&d.yearProblem==='cash')&&canCreateYearDecision(6)){
      state.world.lastDecisionDay=state.company.day; state.world.decisionsCreated=(state.world.decisionsCreated||0)+1; state.world.decisionsCreatedYear=(state.world.decisionsCreatedYear||0)+1;
      state.decisions.unshift({id:'cash'+state.company.nextId++,title:'Cash pressure: нужен план',source:'CFO',risk:'cash',status:'pending',summary:`Cash опустился до ${money(f.cash)}. CEO может сократить расходную часть, ускорить сбор дебиторки или сохранить текущий план и принять риск.`,options:[['A','Снизить расходы','cash_cut',1],['B','Ускорить сбор дебиторки','cash_collect',2],['C','Сохранить текущий план','cash_hold',-3]],optionDetails:{A:'Стабильность cash, ниже темп роста.',B:'Напряжение на клиентах вырастет, но cash восстановится быстрее.',C:'Команда не меняет план, но запас прочности падает.'},createdDay:state.company.day,dueDay:state.company.day+4,yearDecision:true,yearProblem:'cash'});
      addMessageState(state,'board','d3',`Олег, cash просел до ${money(f.cash)}. Нужен твой выбор по плану действий.`,'employee');
    }
  }

      });

  function snapshotYear(s=state){
    const pipeline=s.deals.filter(d=>!['Won','Lost'].includes(d.stage)).reduce((a,d)=>a+d.value*d.prob/100,0);
    s.finance.history.push({day:s.company.day,revenue:Math.round(s.finance.revenue),cash:Math.round(s.finance.cash),profit:Math.round(s.finance.profit),pipeline:Math.round(pipeline)});
    if(s.finance.history.length>366)s.finance.history.shift();
  }

  function recalcYearFinance(s=state){
    const payroll=s.employees.filter(e=>e.status==='active'&&e.type!=='ceo').reduce((a,e)=>a+e.salary,0);
    s.finance.payroll=Math.round(payroll);
    s.finance.profit=Math.round(s.finance.revenue-s.finance.costOfSales-s.finance.operatingExpenses);
    s.finance.burn=Math.max(0,Math.round(s.finance.operatingExpenses/30));
    s.company.revenue=s.finance.revenue;
    s.company.profit=s.finance.profit;
    s.company.cash=s.finance.cash;
    updateGoals(s);
    updateHealth(s);
  }

  function yearTickHour(){
    state.company.minute += 60;
    while(state.company.minute>=60){
      state.company.minute-=60;
      state.company.hour++;
    }
    if(state.company.hour>=24){
      state.company.hour=0;
      state.company.day++;
      processYearDayBoundary();
    }
    processYearPeople();
    processYearTasks();
    processYearDeals();
    processYearProjects();
    processYearContracts();
    processYearFinance();
    recalcYearFinance(state);
    if(state.company.hour===10 || state.company.hour===15){
      const active=state.deals.filter(d=>!['Won','Lost'].includes(d.stage)).sort((a,b)=>(b.value*b.prob)-(a.value*a.prob)).filter(d=>state.company.day-(d.lastMessageDay||0)>=2).slice(0,5);
      active.forEach((d,idx)=>{
        const o=dealOwner(d);if(!o)return;
        const manager=dealManager(d);
        d.lastMessageDay=state.company.day;
        const c=client(d.clientId);
        sayInDeal(d,o.id,`Статус по ${c?.name||'клиенту'}: «${stageNames[d.stage]}», ${Math.round(d.prob)}%. ${d.issue?`Есть вопрос: ${d.issue.title.toLowerCase()}.`:`Следующий шаг — ${d.next||'контакт с клиентом'}.`}`);
        if(manager && idx%2===0) sayInDeal(d,manager.id,`Вижу апдейт. Что конкретно мешает нам перейти к следующему шагу? Давайте не оставлять это до завтра.`);
      });
    }
    if(state.company.hour===17 && state.company.minute===0 && isWorkday(state.company.day)){
      addMessageState(state,'board','d5',`Конец дня ${state.company.day}. Если по клиенту есть незакрытая проблема, поднимаем её сейчас, а не переносим молча.`,'employee');
    }
    save();
  }

  function startYearTimer(){
    state.company.running=true;

  // Тестовый режим: ?yearTest=1 автоматически прогоняет 365 дней без UI-ожидания.
  window.runYearTest=function(days=365){
    const realSave=save;
    save=function(){};
    try{
      state=createYearSeed();
      for(let i=0;i<days*24;i++) yearTickHour();
    } finally {
      save=realSave;
    }
    const activeDeals=state.deals.filter(d=>!['Won','Lost'].includes(d.stage));
    const minCash=Math.min(...state.finance.history.map(h=>h.cash));
    const openTasks=state.tasks.filter(t=>t.status!=='Done');
    const report={day:state.company.day,hour:state.company.hour,employees:activeEmployees().length,clients:state.clients.length,deals:state.deals.length,activeDeals:activeDeals.length,won:state.world.dealsWon,lost:state.world.dealsLost,leads:state.world.leadsCreated,projects:state.projects.length,activeProjects:state.projects.filter(p=>p.status!=='Done').length,tasks:state.tasks.length,openTasks:openTasks.length,decisions:state.decisions.filter(d=>d.status==='pending').length,decisionsCreated:state.world.decisionsCreated||0,decisionsExpired:state.world.decisionsExpired||0,minCash:Math.round(minCash),events:state.events.length,chats:state.chats.length,messages:state.chats.reduce((a,c)=>a+c.messages.length,0),revenue:Math.round(state.finance.revenue),cash:Math.round(state.finance.cash),profit:Math.round(state.finance.profit),receivables:Math.round(state.finance.receivables),recurringDaily:Math.round(state.world.recurringRevenueDaily),avgKpi:Math.round(avg(activeEmployees().filter(e=>e.type!=='ceo').map(e=>e.kpi))),avgMotivation:Math.round(avg(activeEmployees().filter(e=>e.type!=='ceo').map(e=>e.motivation))),stageCounts:Object.fromEntries(stages.map(x=>[x,state.deals.filter(d=>d.stage===x).length])),sampleDeals:state.deals.slice(0,5).map(d=>({id:d.id,stage:d.stage,prob:Math.round(d.prob),next:d.next,stageDay:d.stageStartedDay,issue:!!d.issue})),finite:[state.finance.revenue,state.finance.cash,state.finance.profit].every(Number.isFinite)};
    return report;
  };

  if(location.search.includes('yearTest=1')){
    setTimeout(()=>{
      const report=window.runYearTest(365);
      document.body.innerHTML='<pre style="white-space:pre-wrap;font:14px monospace;padding:20px">'+esc(JSON.stringify(report,null,2))+'</pre>';
      setTimeout(()=>window.close(),100);
    },0);
  }

})();
</script>
